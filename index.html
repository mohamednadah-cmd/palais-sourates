lié que personne ne peut avoir le pouvoir, la force ni la puissance d'Allah, ni un djinn, ni un homme, ni personne."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Et le Prophète ﷺ ne pouvait pas mélanger sa croyance si pure à celle de ces hommes corrompus, qui utilisaient leurs dieux pour garder leurs privilèges et leur rang dans leur cité."}, {"k": "box", "t": "Qu'est-ce qu'un NÉGATEUR (kâfir) ?", "x": "Quand il nous a créés, Allah a mis la foi en Lui dans notre cœur. Mais, en grandissant, certains ont oublié et d'autres ont nié."}, {"k": "box", "t": "Qu'est-ce qu'un NÉGATEUR (kâfir) ?", "x": "Ceux-là sont des négateurs (kâfir), car ils ont nié leur nature première de croyants."}, {"k": "tip", "t": "Mon conseil", "x": "N'oublie jamais qu'Allah est l'Unique, et que rien ni personne n'est au-dessus de Lui."}, {"k": "tip", "t": "Mon conseil", "x": "Respecte la religion des autres, mais ne cherche pas à les imiter dans leur façon de prier ou d'adorer Allah."}, {"k": "tip", "t": "Mon conseil", "x": "Si une personne se moque de ta religion, ne te moque pas de la sienne mais sois fier de ce que tu es, car l'islam est la religion d'Allah et de notre Prophète Moḥammad ﷺ."}, {"k": "morale", "t": "La morale à garder", "x": "Allah est l'Unique et je n'adore que Lui. Je respecte la religion des autres sans les imiter, et je reste fier d'être musulman sans me moquer de personne."}], "quiz": [{"q": "Que veut dire « al-Kâfirûn » ?", "a": ["Les négateurs", "Les voyageurs", "Les anges", "Les voisins"], "e": "Un négateur (kâfir) est quelqu'un qui a nié sa nature première de croyant."}, {"q": "Qui mena les quatre hommes qui vinrent voir le Prophète ﷺ ?", "a": ["Walid ibn al-Moughîra", "Abou Lahab", "Abraha", "`Abd al-Mouṭṭalib"], "e": "Walid ibn al-Moughîra menait ce groupe de quatre hommes."}, {"q": "Quelle proposition firent-ils au Prophète ?", "a": ["Adorer Allah un jour et leurs dieux le lendemain", "Lui offrir de l'or", "Devenir roi", "Quitter La Mecque"], "e": "C'était une proposition absurde."}, {"q": "Que répond la sourate à cette proposition ?", "a": ["Une séparation nette entre croyants et négateurs", "Un accord", "Un silence", "Une dispute"], "e": "Allah montre clairement et définitivement la séparation."}, {"q": "Combien de dieux les Arabes de l'époque avaient-ils en tout ?", "a": ["Plusieurs sortes de dieux (djinns, gens morts, statues)", "Un seul", "Aucun", "Seulement des animaux"], "e": "Ils adoraient les djinns, des gens pieux morts depuis longtemps et des statues."}, {"q": "De quoi étaient faites certaines statues ?", "a": ["De pierre, de bois et même de nourriture", "Seulement d'or", "De glace", "De papier"], "e": "Certaines étaient en nourriture, et quand ils avaient faim, ils les mangeaient !"}, {"q": "Pourquoi le Prophète ﷺ ne pouvait-il pas mélanger sa croyance à la leur ?", "a": ["Sa croyance en Allah est pure, ils adoraient des statues", "Il avait peur d'eux", "Il ne les connaissait pas", "Il était fatigué"], "e": "Il ne pouvait pas mélanger sa croyance si pure à celle d'hommes corrompus."}, {"q": "Que signifie « lakoum dînoukoum wa liya dîn » ?", "a": ["À vous votre religion et à moi ma religion", "À vous mon argent", "À moi votre maison", "Venez avec moi"], "e": "C'est le dernier verset de la sourate."}, {"q": "Que doit-on faire face à la religion des autres ?", "a": ["La respecter sans chercher à l'imiter", "La copier", "S'en moquer", "La combattre"], "e": "Respecte la religion des autres, mais ne cherche pas à les imiter."}, {"q": "Si quelqu'un se moque de ta religion, que fais-tu ?", "a": ["Tu ne te moques pas de la sienne, et tu restes fier de ce que tu es", "Tu l'insultes", "Tu caches ta religion", "Tu changes de religion"], "e": "Sois fier de ce que tu es, car l'islam est la religion d'Allah."}]}, {"id": 97, "ar": "القدر", "fr": "Al-Qadr", "mean": "La destinée", "emo": "🌙", "v": [{"ar": "إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ", "ph": "innâ anzalnâhou fî laylati-l-qadr", "fr": "En vérité, Nous avons révélé le Coran dans la nuit de la Destinée."}, {"ar": "وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ", "ph": "wa mâ adrâka mâ laylatou-l-qadr", "fr": "Et quelle merveilleuse nuit que la nuit de la Destinée !"}, {"ar": "لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ", "ph": "laylatou-l-qadri khayroun min alfi chahr", "fr": "Car la nuit de la Destinée vaut plus que mille mois réunis !"}, {"ar": "تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ", "ph": "tanazzalou-l-malâ'ikatou wa r-roûḥou fîhâ bi-idhni rabbihim min koulli amr", "fr": "C'est au cours de cette nuit que descendent, avec la permission de leur Seigneur, les anges et l'Esprit saint (Jibrîl) pour exécuter les ordres de Dieu."}, {"ar": "سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ", "ph": "salâmoun hiya ḥattâ maṭla`i-l-fajr", "fr": "La paix règne au cours de cette nuit jusqu'au lever de l'aurore !"}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah rappelle que c'est durant la nuit de la destinée qu'Il a révélé le Coran."}, {"k": "theme", "t": "Le thème", "x": "Il montre son immense importance et invite ainsi les hommes à tenter de la chercher pour trouver la paix d'Allah et Sa miséricorde."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Un jour, l'ange Jibrîl raconta que les hommes des temps anciens vivaient bien plus longtemps que nous. Il ajouta que les membres de la communauté du Prophète Moḥammad ﷺ ne vivraient en moyenne qu'entre 60 et 80 ans."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Cela attrista le Prophète, car il se dit que les hommes de sa communauté avaient moins de temps que les générations précédentes pour adorer Allah."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Alors Allah décida d'offrir aux musulmans la nuit de la destinée, une nuit meilleure que mille mois ! Ainsi, celui qui prie, donne une aumône ou fait un bien durant cette nuit aura plus de mille fois la récompense auprès d'Allah."}, {"k": "lesson", "t": "À la recherche de cette nuit extraordinaire", "x": "C'est pourquoi le Prophète ﷺ avait pour habitude de réveiller les membres de sa famille durant les dix dernières nuits afin qu'ils aient la possibilité de vivre la nuit de la destinée. Vivre cette nuit est une miséricorde."}, {"k": "lesson", "t": "À la recherche de cette nuit extraordinaire", "x": "C'est vrai qu'on peut être fatigué et avoir envie de dormir. Mais si tu peux faire quelques prières supplémentaires, Allah te récompensera grandement."}, {"k": "lesson", "t": "À la recherche de cette nuit extraordinaire", "x": "Et tu peux Lui demander tout ce que ton cœur désire : Allah entend toujours les belles prières."}, {"k": "word", "t": "Le mot à retenir", "ar": "لَيْلٌ", "tr": "layl", "x": "Nuit"}, {"k": "box", "t": "Qu'est-ce que la NUIT DE QADR ?", "x": "La nuit d'al-qadr est une nuit grandiose où une noble assemblée d'anges descend. Elle a lieu durant les dix dernières nuits du mois de ramadan et Allah dit qu'elle est meilleure que mille mois."}, {"k": "box", "t": "Qu'est-ce que la NUIT DE QADR ?", "x": "Celui qui adore Allah durant cette nuit, c'est comme s'il L'avait adoré durant toute une vie ! Ainsi, durant les dernières nuits du ramadan, il est bon de passer du temps à prier Allah et à Lui faire nos plus belles demandes."}, {"k": "box", "t": "Qui est L'ESPRIT SAINT ?", "x": "L'Esprit saint est l'ange Jibrîl (Gabriel), le meilleur des anges et le plus proche d'Allah. C'est lui qu'Allah a envoyé à chaque prophète avec Son Message."}, {"k": "box", "t": "Qui est L'ESPRIT SAINT ?", "x": "Il est aussi à la tête de la noble délégation qui descend chaque mois de ramadan sur les hommes la nuit de la destinée (al-qadr)."}, {"k": "tip", "t": "Mon conseil", "x": "Durant les dix derniers jours du mois de ramadan, multiplie les bonnes actions et les prières, surtout après le coucher du soleil. Tu rencontreras peut-être al-laylatou l-qadr, la nuit de la destinée."}, {"k": "tip", "t": "Mon conseil", "x": "Lis le Coran durant ces jours bénis, ce sera pour toi un grand bienfait."}, {"k": "tip", "t": "Mon conseil", "x": "Si tu es en âge de jeûner le mois de ramadan, alors n'aie pas peur et jeûne. Tu verras, Allah te facilitera tes jours de jeûne."}, {"k": "tip", "t": "Mon conseil", "x": "Occupe ta journée à faire des choses intéressantes et à te reposer raisonnablement. Cela passera très vite, car Allah est avec toi."}, {"k": "morale", "t": "La morale à garder", "x": "La nuit de la destinée vaut plus que mille mois : durant les dix dernières nuits du ramadan, je multiplie les prières, je lis le Coran et je fais mes plus belles demandes à Allah."}], "quiz": [{"q": "Que veut dire « al-Qadr » ?", "a": ["La destinée", "La lumière", "Le pardon", "La montagne"], "e": "al-Qadr signifie « la destinée »."}, {"q": "Qu'est-ce qu'Allah a révélé durant la nuit de la destinée ?", "a": ["Le Coran", "La Ka`ba", "La prière", "Le jeûne"], "e": "C'est durant la nuit de la destinée qu'Allah a révélé le Coran."}, {"q": "Que vaut la nuit de la destinée ?", "a": ["Plus que mille mois", "Une seule nuit", "Cent jours", "Dix nuits"], "e": "Elle est meilleure que mille mois."}, {"q": "Quand a lieu cette nuit ?", "a": ["Durant les dix dernières nuits de ramadan", "Au début de ramadan", "Pendant le ḥajj", "À l'Aïd"], "e": "Elle a lieu durant les dix dernières nuits du mois de ramadan."}, {"q": "Qui est l'Esprit saint ?", "a": ["L'ange Jibrîl", "Le prophète Mousa", "Un djinn", "Un voyageur"], "e": "L'Esprit saint est l'ange Jibrîl (Gabriel), le meilleur des anges."}, {"q": "Pourquoi Allah a-t-Il offert cette nuit à la communauté du Prophète ﷺ ?", "a": ["Elle vit moins longtemps que les générations précédentes", "Pour qu'elle dorme plus", "Parce qu'elle est plus riche", "Par hasard"], "e": "Les hommes vivent entre 60 et 80 ans : Allah leur offre une nuit meilleure que mille mois."}, {"q": "Que descend-il du ciel cette nuit-là ?", "a": ["Les anges et l'Esprit saint", "Des étoiles", "De la pluie", "Des oiseaux"], "e": "Ils descendent avec la permission de leur Seigneur pour exécuter Ses ordres."}, {"q": "Que règne-t-il durant cette nuit ?", "a": ["La paix, jusqu'au lever de l'aurore", "Le bruit", "La peur", "La chaleur"], "e": "salâmoun hiya ḥattâ maṭla`i-l-fajr : la paix jusqu'à l'aube."}, {"q": "Que faisait le Prophète ﷺ durant les dix dernières nuits ?", "a": ["Il réveillait sa famille pour qu'elle vive cette nuit", "Il voyageait", "Il dormait plus tôt", "Il restait seul"], "e": "Vivre cette nuit est une miséricorde."}, {"q": "Que veut dire « layl » ?", "a": ["Nuit", "Jour", "Lune", "Soleil"], "e": "layl signifie « nuit »."}]}, {"id": 107, "ar": "الماعون", "fr": "Al-Mâ`ûn", "mean": "L'aide", "emo": "🤝", "v": [{"ar": "أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ", "ph": "ara'ayta l-ladhî youkadhdhibou bi-d-dîn", "fr": "Veux-tu savoir qui traite de mensonge le jour du jugement ?"}, {"ar": "فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ", "ph": "fa-dhâlika l-ladhî yadou``ou-l-yatîm", "fr": "C'est celui qui repousse méchamment l'orphelin"}, {"ar": "وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ", "ph": "wa lâ yaḥouḍḍou `alâ ṭa`âmi-l-miskîn", "fr": "Et qui n'encourage pas à nourrir le pauvre."}, {"ar": "فَوَيْلٌ لِّلْمُصَلِّينَ", "ph": "fa-wayloun li-l-mouṣallîn", "fr": "Malheur à ceux qui négligent la prière,"}, {"ar": "الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ", "ph": "alladhîna houm `an ṣalâtihim sâhoûn", "fr": "Qui la font sans conviction,"}, {"ar": "الَّذِينَ هُمْ يُرَاءُونَ", "ph": "alladhîna houm yourâ'oûn", "fr": "Et qui ne la font que par vanité, pour se montrer,"}, {"ar": "وَيَمْنَعُونَ الْمَاعُونَ", "ph": "wa yamna`oûna-l-mâ`oûn", "fr": "Et qui, de plus, n'accordent aucune aide aux autres."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Cette sourate montre comment on peut faire souffrir une personne en ayant un mauvais comportement."}, {"k": "theme", "t": "Le thème", "x": "Elle explique surtout que ceux qui ne croient pas vraiment en Allah et font semblant de prier ont les plus mauvais comportements envers les plus faibles."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Au temps du Prophète ﷺ, certains Médinois faisaient semblant de croire. Devant le Prophète, ils faisaient tout pour montrer qu'ils étaient de bons musulmans, mais dès qu'ils étaient seuls, ils abandonnaient la prière."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "C'était pour eux une véritable corvée, surtout celle du matin (ṣoubḥ) et celle du soir (`ichâ)."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Dès qu'ils se retrouvaient entre eux, ils se moquaient des paroles du Prophète. Ils ne croyaient pas qu'ils allaient être jugés pour leurs actions, alors ils se plaisaient à faire preuve de méchanceté envers les plus faibles."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Allah a dit d'eux qu'ils étaient des hypocrites (mounâfiqoûn)."}, {"k": "lesson", "t": "Foi et comportement", "x": "Les hypocrites n'avaient pas un bon comportement. Ils faisaient preuve d'injustice et de méchanceté envers les orphelins : ils leur prenaient les biens que leurs parents leur avaient laissés."}, {"k": "lesson", "t": "Foi et comportement", "x": "Ils refusaient de donner à manger aux pauvres. Quand un voisin voulait emprunter quelque chose, comme une assiette ou de la farine, ils faisaient semblant de ne pas en avoir."}, {"k": "lesson", "t": "Foi et comportement", "x": "Si une personne leur demandait un service, ils inventaient une excuse pour se dérober."}, {"k": "lesson", "t": "Foi et comportement", "x": "À ton avis, cela est-il bon ou mauvais ? C'est mauvais bien sûr."}, {"k": "lesson", "t": "Foi et comportement", "x": "Si tu es musulman, cela doit se voir sur ton comportement, dans ton rapport avec les gens."}, {"k": "lesson", "t": "Foi et comportement", "x": "Tu dois être gentil, bon, généreux, attentionné, surtout envers ceux qui en ont le plus besoin : les pauvres, ceux qui n'ont pas de famille, les faibles, mais aussi envers tes parents et ta famille."}, {"k": "lesson", "t": "La prière est importante", "x": "La prière est le signe de ton amour pour Allah. Les hypocrites, eux, ne priaient que par gestes, pas avec le cœur, et uniquement devant le Prophète ﷺ."}, {"k": "lesson", "t": "La prière est importante", "x": "Penses-tu qu'Allah aime qu'un musulman néglige de prier, qu'il manque à sa prière volontairement ou non ?"}, {"k": "lesson", "t": "La prière est importante", "x": "Non, et pourtant la prière est la meilleure manière de te rapprocher d'Allah ; alors surtout ne manque aucune prière et soigne chacune d'entre elles. Quand tu dis Allâhou akbar, essaie de ne penser qu'à Allah."}, {"k": "lesson", "t": "La prière est importante", "x": "Tu verras comment cela nourrira ton cœur et fera de toi une meilleure personne."}, {"k": "word", "t": "Le mot à retenir", "ar": "مِسْكِينٌ", "tr": "miskîn", "x": "C'est un pauvre qui s'en remet à Allah"}, {"k": "box", "t": "Qu'est-ce que la VANITÉ ?", "x": "La vanité est le fait de n'agir que pour se montrer, pour que les gens te voient et que tu en tires une fierté. Quand tu agis par vanité, tu n'agis pas pour Allah, mais pour toi seul."}, {"k": "tip", "t": "Mon conseil", "x": "Allah sait ce que contient ton cœur, alors quand tu fais une bonne action, n'oublie pas de la faire pour Allah, et non pour que les gens te voient."}, {"k": "tip", "t": "Mon conseil", "x": "Sois gentil avec ceux qui sont dans le besoin, ne les juge pas. Il peut arriver qu'une personne n'ait pas de quoi s'habiller correctement ou même se laver régulièrement. Il ne faut pas te moquer d'elle."}, {"k": "tip", "t": "Mon conseil", "x": "La prière est un trésor que tu prépares pour le jour de ta rencontre avec Allah, alors soigne ton trésor et fais qu'il soit beau et abondant."}, {"k": "morale", "t": "La morale à garder", "x": "Je prie avec mon cœur et pour Allah, pas pour me montrer. Je suis généreux et attentionné envers les pauvres, les orphelins, ma famille et mes voisins, et je ne me moque jamais de ceux qui sont dans le besoin."}], "quiz": [{"q": "Que veut dire « al-Mâ`ûn » ?", "a": ["L'aide", "La prière", "La maison", "Le voisin"], "e": "al-Mâ`ûn signifie « l'aide »."}, {"q": "Qui étaient les hypocrites (mounâfiqoûn) ?", "a": ["Des gens qui faisaient semblant de croire", "Des anges", "Des prophètes", "Des orphelins"], "e": "Devant le Prophète, ils faisaient semblant d'être de bons musulmans, mais seuls, ils abandonnaient la prière."}, {"q": "Quelles prières étaient les plus pénibles pour eux ?", "a": ["Celle du matin (ṣoubḥ) et celle du soir (`ichâ)", "Celle du midi", "Celle du vendredi", "Aucune"], "e": "C'était pour eux une véritable corvée."}, {"q": "Que faisaient-ils aux orphelins ?", "a": ["Ils leur prenaient leurs biens", "Ils les adoptaient", "Ils les protégeaient", "Ils les nourrissaient"], "e": "Ils leur prenaient les biens que leurs parents leur avaient laissés."}, {"q": "Que faisaient-ils quand un voisin voulait emprunter quelque chose ?", "a": ["Ils faisaient semblant de ne pas en avoir", "Ils donnaient tout", "Ils prêtaient volontiers", "Ils venaient aider"], "e": "Ils inventaient des excuses pour ne pas aider."}, {"q": "Que veut dire « miskîn » ?", "a": ["Un pauvre qui s'en remet à Allah", "Un roi", "Un voyageur", "Un voisin"], "e": "miskîn, c'est un pauvre qui s'en remet à Allah."}, {"q": "Qu'est-ce que la vanité ?", "a": ["N'agir que pour se montrer", "Être généreux en secret", "Prier avec son cœur", "Aider les autres"], "e": "Quand tu agis par vanité, tu n'agis pas pour Allah mais pour toi seul."}, {"q": "Pour qui faut-il faire une bonne action ?", "a": ["Pour Allah, pas pour que les gens nous voient", "Pour être applaudi", "Pour recevoir un cadeau", "Pour se faire des amis"], "e": "Allah sait ce que contient ton cœur."}, {"q": "Que doit-on faire quand on dit « Allâhou akbar » dans la prière ?", "a": ["Ne penser qu'à Allah", "Penser à ses jeux", "Regarder autour de soi", "Se dépêcher"], "e": "Cela nourrira ton cœur et fera de toi une meilleure personne."}, {"q": "Comment traiter une personne pauvre qui n'a pas de quoi bien s'habiller ?", "a": ["Être gentil, sans la juger ni se moquer", "Se moquer d'elle", "L'éviter", "La critiquer"], "e": "Sois gentil avec ceux qui sont dans le besoin, ne les juge pas."}]}, {"id": 104, "ar": "الهمزة", "fr": "Al-Houmaza", "mean": "Les calomniateurs", "emo": "🔥", "v": [{"ar": "وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ", "ph": "wayloun li-koulli houmazatin l-loumazah", "fr": "Malheur à tout calomniateur à la langue bien pendue"}, {"ar": "الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ", "ph": "alladhî jama`a mâlan wa `addadah", "fr": "Qui ne fait que ramasser des richesses et se plaît à les compter encore et encore,"}, {"ar": "يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ", "ph": "yaḥsabou anna mâlahou akhladah", "fr": "En espérant que sa fortune le rendra éternel !"}, {"ar": "كَلَّا ۖ لَيُنبَذَنَّ فِي الْحُطَمَةِ", "ph": "kallâ la-younbadhanna fi-l-ḥouṭamah", "fr": "Gare à lui, il sera jeté dans le feu de ḥouṭama !"}, {"ar": "وَمَا أَدْرَاكَ مَا الْحُطَمَةُ", "ph": "wa mâ adrâka mâ-l-ḥouṭamah", "fr": "Et qui te dira ce qu'est la ḥouṭama ?"}, {"ar": "نَارُ اللَّهِ الْمُوقَدَةُ", "ph": "nârou Llâhi-l-moûqadah", "fr": "C'est le feu d'Allah qui jamais ne s'éteint,"}, {"ar": "الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ", "ph": "allatî taṭṭali`ou `alâ-l-af'idah", "fr": "Et qui pénètre jusque dans les entrailles des gens maudits."}, {"ar": "إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ", "ph": "innahâ `alayhim mou'ṣadah", "fr": "Ils y seront enfermés de toutes parts"}, {"ar": "فِي عَمَدٍ مُّمَدَّدَةٍ", "ph": "fî `amadin m-moumaddadah", "fr": "Par d'immenses colonnes de flammes."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah prévient qu'Il punira les gens qui aiment se moquer et dire du mal des autres, tout comme ceux qui ne pensent qu'à l'argent et à la richesse."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Alors que le Prophète Moḥammad ﷺ invitait son peuple à l'islam, certains passaient leur temps à se moquer de lui."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Ils étaient nombreux, mais il y avait surtout des gens comme Oumayya ibn Khalaf, Walid ibn al-Moughîra et bien d'autres qui disaient du mal du Prophète chaque fois qu'ils le pouvaient."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "C'étaient des hommes méchants, qui faisaient du mal aux plus faibles. Parce qu'ils étaient riches, ils pensaient qu'ils pouvaient faire ce qu'ils voulaient."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Et ces hommes aimaient tellement l'argent qu'ils ne respectaient rien ni personne pour en gagner. Ils étaient arrogants et pensaient qu'Allah ne les regardait pas et qu'ils ne seraient pas jugés pour leurs actes."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Ils étaient nombreux à La Mecque à agir ainsi et cela attristait beaucoup le Prophète. Alors Allah révéla cette sourate pour dire à Son Messager de ne pas s'inquiéter et qu'Il avait préparé pour eux une douloureuse punition."}, {"k": "lesson", "t": "Les calomniateurs", "x": "Sais-tu ce qu'est un calomniateur ? C'est un homme qui raconte des mensonges sur les autres."}, {"k": "lesson", "t": "Les calomniateurs", "x": "Un calomniateur aime se moquer des gens et les insulter. Sache qu'Allah déteste ce genre de comportement, car on ne doit jamais se sentir supérieur ni dénigrer les autres."}, {"k": "lesson", "t": "Les calomniateurs", "x": "Allah n'aime pas non plus les gens qui ont des richesses et qui ne pensent qu'à elles. Ils les cachent pour que personne ne les voie et ils pensent qu'il n'y a rien de plus important sur terre."}, {"k": "lesson", "t": "Les calomniateurs", "x": "T'arrive-t-il parfois de cacher un jouet parce que tu le trouves trop précieux pour le partager avec tes frères et sœurs ou tes amis ?"}, {"k": "lesson", "t": "Les calomniateurs", "x": "Ce n'est pas très grave, certes, mais Allah aime les gens généreux, ceux qui préfèrent partager plutôt que de garder pour eux seuls. Partager rend heureux et fait plaisir."}, {"k": "lesson", "t": "Les calomniateurs", "x": "Il faut aussi respecter les autres et ne pas dire du mal d'eux, que cela soit vrai ou non. Car Allah a préparé une place spéciale pour ceux qui méprisent les gens : Il a préparé l'enfer nommé ḥouṭama."}, {"k": "lesson", "t": "Les calomniateurs", "x": "C'est un enfer brûlant d'où personne ne peut s'échapper. Il faut donc tout faire pour s'éloigner de cela et essayer de plaire à Allah."}, {"k": "word", "t": "Le mot à retenir", "ar": "نَارٌ", "tr": "nâr", "x": "Enfer"}, {"k": "box", "t": "Qu'est-ce que la ḤOUṬAMA ?", "x": "C'est le nom d'un enfer pour les gens qui ne pensent qu'à gagner de l'argent et à augmenter leurs richesses sans jamais rien en donner aux autres. Ils n'aiment ni Allah ni les gens et la seule chose qu'ils adorent est la richesse."}, {"k": "tip", "t": "Mon conseil", "x": "Ne te moque jamais des autres, et ne dis pas de mal sur eux, car Allah veut que les musulmans soient de bonnes personnes, avec de nobles caractères, et non avec des défauts mesquins."}, {"k": "tip", "t": "Mon conseil", "x": "Tu as le droit de prendre soin de tes affaires, mais cela ne doit pas te pousser à devenir égoïste au point de ne plus rien partager."}, {"k": "tip", "t": "Mon conseil", "x": "Demande à Allah de te protéger de l'enfer et de faire de toi un bon musulman, avec un bon caractère et de nobles comportements."}, {"k": "tip", "t": "Mon conseil", "x": "Tu dois faire l'effort de combattre tes penchants négatifs, sinon ils auront raison de toi."}, {"k": "morale", "t": "La morale à garder", "x": "Je ne me moque jamais des autres et je ne dis pas de mal d'eux. Je partage au lieu de tout garder pour moi : l'argent ne rend pas éternel, et Allah aime les gens généreux."}], "quiz": [{"q": "Que veut dire « al-Houmaza » ?", "a": ["Les calomniateurs", "Les voyageurs", "Les riches", "Les anges"], "e": "al-Houmaza signifie « les calomniateurs »."}, {"q": "Qu'est-ce qu'un calomniateur ?", "a": ["Quelqu'un qui raconte des mensonges sur les autres et se moque d'eux", "Quelqu'un qui dit la vérité", "Quelqu'un qui aide", "Quelqu'un qui prie"], "e": "Il aime se moquer des gens et les insulter."}, {"q": "Que veut dire « nâr » ?", "a": ["Enfer", "Eau", "Lumière", "Terre"], "e": "nâr signifie « enfer » (le feu)."}, {"q": "Qu'est-ce que la ḥouṭama ?", "a": ["Un enfer brûlant d'où personne ne peut s'échapper", "Un jardin", "Une ville", "Une montagne"], "e": "C'est le nom d'un enfer pour ceux qui n'aiment que l'argent et ne donnent rien."}, {"q": "Que pensait l'homme riche du verset 3 ?", "a": ["Que sa fortune le rendrait éternel", "Que sa fortune disparaîtrait", "Que l'argent ne sert à rien", "Qu'il devait tout donner"], "e": "Il espère que sa fortune le rendra éternel !"}, {"q": "Qui faisait souvent du mal au Prophète ﷺ en disant du mal de lui ?", "a": ["Oumayya ibn Khalaf et Walid ibn al-Moughîra", "`Ammâr ibn Yasîr", "Abou Bakr", "`Abd al-Mouṭṭalib"], "e": "Ces hommes riches et arrogants disaient du mal du Prophète chaque fois qu'ils le pouvaient."}, {"q": "Allah aime les gens…", "a": ["Généreux, qui préfèrent partager", "Qui gardent tout pour eux", "Qui cachent leur argent", "Qui comptent leurs richesses"], "e": "Partager rend heureux et fait plaisir."}, {"q": "Que faut-il faire de ses richesses ?", "a": ["Les partager, sans devenir égoïste", "Les cacher", "Les compter encore et encore", "Les adorer"], "e": "Tu as le droit de prendre soin de tes affaires, mais pas de devenir égoïste."}, {"q": "Peut-on dire du mal de quelqu'un si c'est vrai ?", "a": ["Non, il ne faut pas dire du mal des autres, vrai ou non", "Oui, toujours", "Oui, devant tout le monde", "Oui, en rigolant"], "e": "Il faut respecter les autres et ne pas dire du mal d'eux, que cela soit vrai ou non."}, {"q": "Que doit-on demander à Allah ?", "a": ["De nous protéger de l'enfer et de nous donner un bon caractère", "De nous rendre riches", "De punir nos amis", "De faire disparaître l'école"], "e": "Demande à Allah de faire de toi un bon musulman, avec de nobles comportements."}]}, {"id": 95, "ar": "التين", "fr": "At-Tîn", "mean": "Le figuier", "emo": "🫒", "v": [{"ar": "وَالتِّينِ وَالزَّيْتُونِ", "ph": "wa t-tîni wa z-zaytoûn", "fr": "Par le figuier et l'olivier,"}, {"ar": "وَطُورِ سِينِينَ", "ph": "wa ṭoûri sînîn", "fr": "par le mont Sinaï"}, {"ar": "وَهَٰذَا الْبَلَدِ الْأَمِينِ", "ph": "wa hâdha-l-baladi-l-amîn", "fr": "et par cette cité sacrée !"}, {"ar": "لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ", "ph": "laqad khalaqna-l-insâna fî aḥsani taqwîm", "fr": "En vérité, Nous avons créé l'homme de la forme la plus parfaite."}, {"ar": "ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ", "ph": "thoumma radadnâhou asfala sâfilîn", "fr": "Nous l'avons ensuite fait redescendre au plus bas niveau,"}, {"ar": "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ", "ph": "illa-lladhîna âmanoû wa `amilou ṣ-ṣâliḥâti falahoum ajroun ghayrou mamnoûn", "fr": "sauf celui qui croit, fait de bonnes actions. Ces hommes recevront alors une récompense infinie !"}, {"ar": "فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ", "ph": "famâ youkadhdhibouka ba`dou bi-d-dîn", "fr": "Comment peux-tu après cela douter encore du jugement dernier ?"}, {"ar": "أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ", "ph": "alaysa Llâhou bi-aḥkami-l-ḥâkimîn", "fr": "Dieu n'est-Il pas le plus Équitable des juges ?"}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah rappelle que l'homme est la meilleure créature qu'Il ait faite, mais elle peut se révéler être la pire si elle n'obéit pas à Allah."}, {"k": "theme", "t": "Le thème", "x": "La sourate rappelle aussi combien Allah est le plus Juste, et qu'Il rendra la meilleure justice quand Il jugera les êtres humains."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "À travers cette sourate, Allah veut nous rappeler combien nous sommes liés à notre état physique et intellectuel."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Notre Seigneur nous a façonnés de la meilleure des manières et, quand nous sommes dans cet état, nous nous sentons forts et intelligents."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Mais lorsque la vieillesse arrive, ou que survient la maladie, nous nous sentons faibles, à la merci de tout, et toutes nos forces ont alors disparu."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Ainsi, il ne faut pas se sentir tout-puissant, il faut rester humble et se rappeler que nous pouvons devenir très faibles."}, {"k": "lesson", "t": "Obéir à Allah, quel que soit notre état", "x": "Que l'on soit en situation de force et de santé, ou que l'on soit en situation de faiblesse et de maladie, nous devons continuer à être de bons musulmans et à faire le bien."}, {"k": "lesson", "t": "Obéir à Allah, quel que soit notre état", "x": "Si nous savons rester humbles et nous en remettre à Allah en toutes circonstances, Il nous récompensera d'un bien immense, qui ne s'épuisera jamais."}, {"k": "lesson", "t": "Obéir à Allah, quel que soit notre état", "x": "Et pour montrer la force de Sa promesse, Allah jure par trois endroits : Jérusalem, la contrée des figuiers et des oliviers, terre de prophètes."}, {"k": "lesson", "t": "Obéir à Allah, quel que soit notre état", "x": "Puis Il jure par le mont Sinaï où Il a parlé au grand prophète Mousa, et enfin par la cité sûre de La Mecque, là où le Prophète ﷺ est né."}, {"k": "lesson", "t": "Obéir à Allah, quel que soit notre état", "x": "Puis Allah nous dit : « Si vous êtes les créatures les plus parfaites et que Je vous ai donné les plus grands biens, ainsi que le message, pourquoi certains d'entre vous continuent-ils de mentir, de ne pas croire au jour du jugement dernier ? N'oubliez pas que Je suis le plus Équitable des juges et que Je n'oublierai aucune de vos actions, ni aucun de vos mensonges. »"}, {"k": "lesson", "t": "Obéir à Allah, quel que soit notre état", "x": "Qu'Allah nous protège et que nous soyons de bons musulmans jusqu'à la fin de notre vie !"}, {"k": "word", "t": "Le mot à retenir", "ar": "بَلَدٌ", "tr": "balad", "x": "Pays"}, {"k": "word", "t": "Le mot à retenir", "ar": "زَيْتُونٌ", "tr": "zaytoûn", "x": "Olives"}, {"k": "box", "t": "Qu'est-ce que la FIGUE ?", "x": "La figue est un fruit très ancien et très apprécié. Il a été repéré pour la première fois dans l'ouest de l'Asie."}, {"k": "box", "t": "Qu'est-ce que la FIGUE ?", "x": "C'est un fruit doux et très sucré que l'on retrouve un peu partout dans les pays méditerranéens et que l'on récolte au milieu de l'été."}, {"k": "box", "t": "Qu'est-ce que l'OLIVIER ?", "x": "L'olivier est l'arbre qui produit des olives. Les olives contiennent énormément de nutriments."}, {"k": "box", "t": "Qu'est-ce que l'OLIVIER ?", "x": "Quand elles ne sont pas encore mûres, on les cueille et on les mange crues ou mises en saumure ou en conserve. Et quand elles sont très mûres, on fait des olives une huile très appréciée car très bonne pour la santé."}, {"k": "box", "t": "Qu'est-ce que le SINAÏ ?", "x": "Le Sinaï est un mont qui se trouve dans l'actuelle Égypte, à la frontière avec la Palestine. On l'appelle aussi jabal Mousa (le mont de Mousa) car c'est à cet endroit qu'Allah a parlé au prophète Mousa. Le mont fait 2285 mètres d'altitude."}, {"k": "tip", "t": "Mon conseil", "x": "Remercie Allah pour t'avoir créé de manière si parfaite et dis al-ḥamdoulillâh pour ce corps qui t'abrite chaque jour."}, {"k": "tip", "t": "Mon conseil", "x": "Si tu es fort et en bonne santé, n'oublie pas qu'il y a des gens faibles et malades, alors offre-leur ton aide. C'est une autre manière de remercier Allah."}, {"k": "tip", "t": "Mon conseil", "x": "À la fin de cette sourate, il est recommandé de dire : balâ oua anâ `alâ dhâlika min ach-châhidîn (Bien sûr, et de cela je suis témoin). Cela signifie que tu reconnais qu'Allah est le plus Juste des juges."}, {"k": "morale", "t": "La morale à garder", "x": "Allah m'a créé de la plus belle façon : je Le remercie pour mon corps, je reste humble car je peux devenir faible, j'aide les malades et les faibles, et je reconnais qu'Allah est le plus Juste des juges."}], "quiz": [{"q": "Que veut dire « at-Tîn » ?", "a": ["Le figuier", "L'olivier", "Le palmier", "Le raisin"], "e": "at-Tîn signifie « le figuier »."}, {"q": "Que veut dire « zaytoûn » ?", "a": ["Olives", "Figues", "Dattes", "Pommes"], "e": "zaytoûn signifie « olives »."}, {"q": "Que veut dire « balad » ?", "a": ["Pays", "Mer", "Ciel", "Montagne"], "e": "balad signifie « pays » (ici la cité sûre de La Mecque)."}, {"q": "Par quel mont Allah jure-t-Il ?", "a": ["Le mont Sinaï", "Le mont Uḥud", "Le mont Ararat", "Le mont Ṣafa"], "e": "C'est là qu'Allah a parlé au prophète Mousa."}, {"q": "Quel est l'autre nom du mont Sinaï ?", "a": ["Jabal Mousa", "Jabal Nour", "Jabal Arafa", "Jabal Ṣafa"], "e": "On l'appelle aussi le mont de Mousa."}, {"q": "Comment Allah a-t-Il créé l'homme ?", "a": ["De la forme la plus parfaite", "De la forme la plus petite", "Sans forme", "De façon imparfaite"], "e": "laqad khalaqna-l-insâna fî aḥsani taqwîm."}, {"q": "Que se passe-t-il quand on est vieux ou malade ?", "a": ["On se sent faible et on perd ses forces", "On devient plus fort", "Rien ne change", "On devient invisible"], "e": "Il ne faut pas se sentir tout-puissant : il faut rester humble."}, {"q": "Qui reçoit une récompense infinie ?", "a": ["Celui qui croit et fait de bonnes actions", "Celui qui est riche", "Celui qui est fort", "Celui qui dort beaucoup"], "e": "illa-lladhîna âmanoû wa `amilou ṣ-ṣâliḥât : leur récompense ne s'épuisera jamais."}, {"q": "Que dit-on à la fin de cette sourate ?", "a": ["Balâ oua anâ `alâ dhâlika min ach-châhidîn", "Subḥân Allah", "Astaghfiroullâh", "Allâhou akbar"], "e": "Cela veut dire : « Bien sûr, et de cela je suis témoin. »"}, {"q": "Comment remercier Allah pour ta santé ?", "a": ["En aidant les gens faibles et malades", "En les évitant", "En se moquant", "En ne faisant rien"], "e": "C'est une autre manière de remercier Allah."}]}, {"id": 99, "ar": "الزلزلة", "fr": "Az-Zalzala", "mean": "Le tremblement de terre", "emo": "🌍", "v": [{"ar": "إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا", "ph": "idhâ zoulzilati-l-arḍou zilzâlahâ", "fr": "Lorsque la terre sera toute secouée et qu'elle tremblera ;"}, {"ar": "وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا", "ph": "wa akhrajati-l-arḍou athqâlahâ", "fr": "Lorsqu'elle se videra de ce qu'elle contient,"}, {"ar": "وَقَالَ الْإِنسَانُ مَا لَهَا", "ph": "wa qâla-l-insânou mâ lahâ", "fr": "Et que l'homme, étonné, se demandera : « Qu'a-t-elle donc ? »,"}, {"ar": "يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا", "ph": "yawma'idhin touḥaddithou akhbârahâ", "fr": "Ce jour-là, la terre racontera son histoire et dira"}, {"ar": "بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا", "ph": "bi-anna rabbaka awḥâ lahâ", "fr": "ce que son Seigneur lui révélera."}, {"ar": "يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ", "ph": "yawma'idhin yaṣdourou n-nâsou achtâtan li-youraw a`mâlahoum", "fr": "Et, ce jour-là, les hommes surgiront de leurs tombes séparément, pour être confrontés à leurs actions."}, {"ar": "فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ", "ph": "faman ya`mal mithqâla dharratin khayran yarah", "fr": "Quiconque fait ne serait-ce qu'un petit bien le verra ;"}, {"ar": "وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ", "ph": "wa man ya`mal mithqâla dharratin charran yarah", "fr": "et quiconque fait ne serait-ce qu'un petit mal le verra aussi."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah évoque les signes qui marqueront le début de la fin du monde. Les hommes verront alors le résultat de leurs actions. Qu'Allah nous compte parmi ceux qu'Il aime !"}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "À l'époque du Prophète Moḥammad ﷺ, certains musulmans pensaient qu'Allah ne les récompenserait pas pour les petites bonnes actions du quotidien qu'ils pouvaient faire, comme donner une petite pièce à un pauv function tek(t,v=.22){if(!NOISE){NOISE=ACX.createBuffer(1,ACX.sampleRate*.2|0,ACX.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=ACX.createBufferSource();s.buffer=NOISE;const f=ACX.createBiquadFilter();f.type='highpass';f.frequency.value=2800;const g=ACX.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+.12);tone(820,t,.05,{type:'triangle',vol:v*.35});}
function sparkle(t,n=8,v=.04){for(let i=0;i<n;i++)tone(2000+Math.random()*2600,t+i*.045,.16,{vol:v});}
const HIJAZ=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];
function sfx(kind){
  if(DB.data.settings.sound===false)return;
  try{const c=fxCtx();if(!c)return;const t=c.currentTime+.03;
    switch(kind){
      case 'tap':tone(700,t,.05,{type:'triangle',vol:.05});break;
      case 'soft':bell(1046.5,t,.09);break;
      case 'good':bell(783.99,t);bell(1174.66,t+.11);bell(1567.98,t+.22,.1);sparkle(t+.28,6);break;
      case 'bad':tone(440,t,.2,{type:'triangle',vol:.26,glide:370});tone(349.23,t+.19,.42,{type:'triangle',vol:.24,glide:293.66});tone(880,t,.15,{vol:.05});break;
      case 'coin':tone(987.77,t,.08,{type:'square',vol:.1});tone(1318.5,t+.08,.45,{type:'square',vol:.1});sparkle(t+.12,8,.06);break;
      case 'stage':doum(t);tek(t+.16);tek(t+.24);doum(t+.32);[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,t+.05+i*.09,.13));tone(987.77,t+.45,.08,{type:'square',vol:.05});tone(1318.5,t+.53,.45,{type:'square',vol:.05});sparkle(t+.55,10);break;
      case 'sourate':{const b=.15;doum(t);tek(t+2*b);tek(t+3*b);doum(t+4*b);tek(t+6*b);
        HIJAZ.forEach((f,i)=>pluck(f,t+.15+i*.075));[587.33,523.25,466.16,440].forEach((f,i)=>pluck(f,t+.8+i*.08,.12));pluck(440,t+1.15,.13);pluck(587.33,t+1.3,.16);
        doum(t+1.05,.6);tek(t+1.2);tek(t+1.28);doum(t+1.36,.65);
        [293.66,369.99,440,587.33,739.99,880,1174.66].forEach((f,i)=>bell(f,t+1.45+i*.035,.1));
        for(let i=0;i<16;i++)tone(1800+Math.random()*3200,t+1.5+i*.07,.28,{vol:.03});break;}
    }
  }catch(e){}
}

/* ---------- effets ---------- */
function confetti(n=140){
  let cv=document.getElementById('fx');if(!cv){cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv);}
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;const x=cv.getContext('2d');
  const cols=['#f4c542','#ffe39a','#22b8b0','#ef6aa0','#ff6f59','#8b5cf6','#3cc98f'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*22*devicePixelRatio,vy:(-12-Math.random()*16)*devicePixelRatio,r:(5+Math.random()*7)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],s:Math.random()<.5}));
  let t=0;(function f(){x.clearRect(0,0,W,H);t++;for(const p of ps){p.vy+=.45*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.s){x.beginPath();for(let i=0;i<16;i++){const an=i*Math.PI/8,R=i%2?p.r*.6:p.r;x.lineTo(R*Math.cos(an),R*Math.sin(an));}x.closePath();x.fill();}else{x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}x.restore();}if(t<170)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})();
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function overlay(html,onBind){closeOverlay();const o=document.createElement('div');o.className='overlay';o.id='ov';o.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(o);onBind&&onBind(o);return o;}

function keypad(len,onDone,title,sub){

    bind(root){let v='';const dots=root.querySelector('.dots');const upd=()=>dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
      on(root,'.key','click',(e,b)=>{chime('tap');const k=b.dataset.k;if(k==='del')v=v.slice(0,-1);else if(v.length<len)v+=k;upd();
        if(v.length===len){const val=v;setTimeout(()=>{const ok=onDone(val);if(ok===false){dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');chime('no');v='';upd();}},150);}});}};
}

    case 'dome': return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-30" y="-30" width="60" height="30" fill="#2a2470"/><path d="M-26 -30 C -26 -64 0 -76 0 -76 C 0 -76 26 -64 26 -30 Z" fill="#3a3290"/><path d="M0 -76 L0 -88" stroke="#f4c542" stroke-width="2"/><circle cx="0" cy="-90" r="3" fill="#f4c542"/><path d="M-8 0 L-8 -14 C -8 -22 8 -22 8 -14 L 8 0 Z" fill="#ffd56a" opacity=".85"/></g>`;

/* ----- reconnaissance vocale (version web) ----- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC=!!(window.WEB_BUILD&&SRC);
function fold(w){return w.replace(/[قك]/g,'ك').replace(/[حهخ]/g,'ه').replace(/[عءاأإآ]/g,'ا').replace(/[صسث]/g,'س').replace(/[ضد]/g,'د').replace(/[طت]/g,'ت').replace(/[ظذز]/g,'ز').replace(/غ/g,'ر');}
function nw(w){return fold(nw0(w));}
function nw0(w){return String(w).replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي]/g,'');}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sim(a,b){if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length);}
function grade(words,text){
  const E=words.map(nw),R=String(text).split(/\s+/).map(nw).filter(Boolean),n=E.length,m=R.length;
  const eq=(i,j)=>sim(E[i],R[j])>=.55;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]+(eq(i-1,j-1)?1:0));
  const ok=E.map(e=>!e);let i=n,j=m;
  while(i>0&&j>0){if(eq(i-1,j-1)&&dp[i][j]===dp[i-1][j-1]+1){ok[i-1]=true;i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
  const real=E.filter(Boolean).length||1;const ws=ok.filter((v,k)=>v&&E[k]).length/real;
  const cs=sim(E.join(''),R.join(''));
  return {ok,score:Math.max(ws,cs*0.9)};
}
function listenAr({onText,onEnd,maxMs}){
  if(!SRC)return null;let r;try{r=new SRC();}catch(e){return null;}
  r.lang='ar-SA';r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
  let text='',err=null,ended=false;
  r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=' '+e.results[i][0].transcript;text=t.trim();onText(text);};
  r.onerror=e=>{err=e.error;};
  const fin=()=>{if(ended)return;ended=true;clearTimeout(tm);onEnd(text,err);};
  r.onend=fin;const tm=setTimeout(()=>{try{r.stop();}catch(e){}setTimeout(fin,1500);},maxMs);
  try{r.start();}catch(e){return null;}
  return r;
}

      orb.classList.remove('you');core.textContent='↻';ins.innerHTML='Bravo !<small>Tu peux recommencer ou continuer.</small>';L.rep=true;el.querySelector('#nx').disabled=false;chime('ok');};
    core.onclick=run;el.querySelector('#nx').onclick=()=>{L.rep=false;next();};
    return;
  }
  if(step.t==='mask'){
    const lvl=step.lvl;
    if(MIC&&!L.reveal){micStep([k],`<div class="inst">Récite le verset ${k} à voix haute<small>Touche le micro, récite, puis « J'ai fini ».</small></div>`,`<div class="verse-card">${numBadge(k)}${verseBlock(s,k,lvl,{})}</div>`,()=>{chime('ok');next();});return;}
    const el=view(head+`<div class="inst">Récite le verset ${k} à voix haute<small>Seul le premier mot est affiché. Touche un trait doré si tu bloques.</small></div>
      <div class="verse-card" id="vc">${numBadge(k)}${verseBlock(s,k,L.reveal?0:lvl,{fr:L.reveal&&L.fr})}</div>
      ${L.reveal?`<div class="inst" style="font-size:1.4rem">Tu l'as bien dit ?</div><div class="rate"><button class="btn coral" data-no>↺ Pas encore</button><button class="btn turq" data-yes>✓ Oui !</button></div>`
        :`<button class="btn block" data-check>🎧 Vérifier en écoutant</button>`}`,'lesson');
    bindToggles(el);bindPeek(el);
    on(el,'[data-check]','click',()=>{L.reveal=true;render();playList(s.id,[k]);});
    on(el,'[data-yes]','click',()=>{L.reveal=false;chime('ok');next();});

  }
  if(step.t==='chain'||step.t==='final'){
    const fin=step.t==='final';const list=step.list||range(1,k);const lastStep=L.i===L.steps.length-1;
    const what=list.length===1?`le verset ${list[0]}`:list.length===n?'toute la sourate':`les versets ${list[0]} à ${list[list.length-1]} ensemble`;
    const finTitle=list.length===n&&n>1?'Le grand défi !':list.length>1?'On assemble !':`Récite le verset ${list[0]}`;
    const finalOK=()=>{if(practice||!DB.data.settings.parentCheck){finishStage();return;}
      const kp=keypad(4,v=>{if(v===PARENT_CODE){closeOverlay();finishStage();return true;}return false;},'Montre à un parent','Récite devant papa ou maman. Le parent tape son code pour valider.');
      overlay(`<div class="panel">${kp.html}<button class="btn ghost block" data-x style="margin-top:14px">Je m'entraîne encore</button></div>`,o=>{kp.bind(o);on(o,'[data-x]','click',closeOverlay);});};
    if(MIC&&!fin&&!L.reveal){micStep(list,`<div class="inst">Récite les versets 1 à ${k} à voix haute<small>Le premier mot de chaque verset est affiché. Touche le micro, récite tout, puis « J'ai fini ».</small></div>`,`<div class="chain">${list.map(v=>`<div class="vline" data-v="${v}">${verseBlock(s,v,3,{})}</div>`).join('')}</div>`,()=>{chime('ok');next();});return;}
    if(MIC&&fin&&!L.reveal){micStep(list,`<div class="inst">${finTitle}<small>Récite ${what} de mémoire, sans regarder.</small></div>`,`<div class="rounds" style="gap:16px;margin:14px 0">${list.map(v=>`<span style="width:56px;height:56px;position:relative;display:inline-block">${numBadge(v).replace('class="num"','style="width:56px;height:56px"')}</span>`).join('')}</div>`,lastStep?finalOK:()=>{chime('ok');next();});return;}
    const ins=fin?`<div class="inst">${finTitle}<small>Récite ${what} de mémoire, sans regarder.</small></div>`
      :`<div class="inst">Récite les versets 1 à ${k}<small>Seul le premier mot de chaque verset est affiché.</small></div>`;
    const body=fin&&!L.reveal?`<div class="rounds" style="gap:16px;margin:20px 0">${list.map(v=>`<span style="width:56px;height:56px;position:relative;display:inline-block">${numBadge(v).replace('class="num"','style="width:56px;height:56px"')}</span>`).join('')}</div><div style="text-align:center;font-size:4rem">🤫</div>`
      :`<div class="chain">${list.map(v=>`<div class="vline" data-v="${v}">${verseBlock(s,v,L.reveal?0:3,{})}</div>`).join('')}</div>`;
    const el=view(head+ins+body+(L.reveal?`<div class="inst" style="font-size:1.4rem">Tu as tout bien récité ?</div><div class="rate"><button class="btn coral" data-no>↺ Pas encore</button><button class="btn turq" data-yes>✓ Oui !</button></div>`
      :`<button class="btn block" data-check>🎧 Vérifier en écoutant</button>`),'lesson');
    bindToggles(el);bindPeek(el);
    const hl=v=>el.querySelectorAll('.vline').forEach(d=>{const a=+d.dataset.v===v;d.classList.toggle('playing',a);if(a)d.scrollIntoView({block:'center',behavior:'smooth'});});
    on(el,'[data-check]','click',()=>{L.reveal=true;render();setTimeout(()=>{const e2=app.firstElementChild;const h2=v=>e2.querySelectorAll('.vline').forEach(d=>{const a=+d.dataset.v===v;d.classList.toggle('playing',a);if(a)d.scrollIntoView({block:'center',behavior:'smooth'});});playList(s.id,list,h2);},50);});
    on(el,'[data-no]','click',()=>{L.reveal=false;stopAudio();if(fin&&list.length===1){L.i=0;toast('On réécoute 3 fois, puis tu réessaies.');}else toast('Réécoute les versets, puis réessaie.');render();});
    on(el,'[data-yes]','click',()=>{L.reveal=false;stopAudio();if(!fin||!lastStep){chime('ok');next();return;}finalOK();});
    return;
  }
  function micStep(list,insHTML,cardHTML,onPass){

        <div class="scorebar"><i style="width:${pct}%" class="${pass?'ok':''}"></i><span>${pct} %</span></div>
        ${coloredLines(s,list,R.ok)}
        ${R.heard?`<div class="heard">J'ai entendu : <span class="ar">${esc(R.heard)}</span></div>`:''}
        ${pass?`<button class="btn turq block" data-pass>Continuer ➜</button>`:`<div class="rate"><button class="btn" data-listen>🎧 Écouter</button><button class="btn turq" data-retry>🎤 Réessayer</button></div>${list.length===1?`<button class="btn ghost block" data-relearn>↺ Réécouter le verset</button>`:''}`}`,'lesson');

    on(el,'[data-manual]','click',()=>{L.mic=null;L.reveal=true;render();if(step.t==='mask')playList(s.id,list);else setTimeout(()=>{const e2=app.firstElementChild;playList(s.id,list,v=>e2.querySelectorAll('.vline').forEach(d=>{const a=+d.dataset.v===v;d.classList.toggle('playing',a);}));},50);});
    const orb=el.querySelector('#orb'),hd=el.querySelector('#heard'),done=el.querySelector('#done'),mic=el.querySelector('#mic');
    let rec=null;
    mic.onclick=()=>{if(rec)return;stopAudio();
      const expected=list.reduce((t,v)=>t+dur(s.id,v),0);
      orb.classList.add('on');mic.textContent='👂';hd.hidden=false;hd.innerHTML='<span class="muted">Je t\'écoute…</span>';done.hidden=false;el.querySelector('[data-manual]').hidden=true;

/* ----- comprendre : cartes ----- */
const ART={theme:'🌙',story:'📜',lesson:'📖',word:'✒️',box:'💡',tip:'🏮',morale:'💛'};
const KIND={theme:'Le thème',story:'Pourquoi cette sourate ?',lesson:'Ce qu\'elle nous apprend',word:'Le mot à retenir',box:'Le savais-tu ?',tip:'Mon conseil',morale:'La morale à garder'};
SCREENS.cards=()=>{
  const p=me();const s=BY[S.p.sid];const x=sp(p,s.id);const C=s.cards;let i=S.p.i||0;
  const card=c=>`<div class="ccard ${c.k}" id="cc"><div style="font-size:3.6rem;line-height:1">${ART[c.k]}</div><div class="kind">${esc(c.k==='lesson'?c.t:c.k==='box'?c.t:KIND[c.k])}</div>${c.k==='word'?`<div class="bigar">${esc(c.ar)}</div><div style="font-weight:700;color:#5b2a7a;font-size:1.3rem">${esc(c.tr)}</div>`:''}<div class="txt">${esc(c.x)}</div></div>`;
  const last=i===C.length-1;
  const el=view(`<div class="topbar"><button class="iconbtn" data-back aria-label="Retour">✕</button><div class="progress"><i style="width:${((i+1)/C.length*100).toFixed(0)}%"></i></div><span class="small muted">${i+1}/${C.length}</span></div>
    <div class="stage-label">${esc(s.fr)} · Comprendre</div>

    ${last?`<button class="btn turq block" data-keep>💛 Je garde cette morale dans mon cœur</button>`:`<div class="swipe-hint">Fais glisser la carte vers la gauche ➜</div>`}
    <div class="row"><button class="btn ghost" data-prev ${i===0?'disabled':''} style="flex:1">‹ Avant</button>${last?'':`<button class="btn" data-next style="flex:2">Suivant ›</button>`}</div>`,'lesson');

  if(S.p.dir){cc.classList.add(S.p.dir>0?'in-r':'in-l');requestAnimationFrame(()=>requestAnimationFrame(()=>cc.classList.remove('in-r','in-l')));S.p.dir=0;}
  const move=d=>{const j=i+d;if(j<0||j>=C.length)return;cc.classList.add(d>0?'out-l':'out-r');chime('tap');setTimeout(()=>{S.p.i=j;S.p.dir=d;render();},260);};
  on(el,'[data-next]','click',()=>move(1));on(el,'[data-prev]','click',()=>move(-1));
  let sx=null,dx=0;deck.addEventListener('pointerdown',e=>{sx=e.clientX;dx=0;cc.style.transition='none';});

  const end=()=>{if(sx===null)return;sx=null;cc.style.transition='';cc.style.transform='';if(dx<-60)move(1);else if(dx>60)move(-1);};
  deck.addEventListener('pointerup',end);deck.addEventListener('pointercancel',end);deck.addEventListener('pointerleave',end);
  on(el,'[data-keep]','click',()=>{const first=!x.understood;x.understood=true;save();chime('ok');if(first)confetti(80);S.screen='quiz';S.p={sid:s.id};render();window.scrollTo(0,0);});
};

/* ----- quiz ----- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
SCREENS.quiz=()=>{
  const p=me();const s=BY[S.p.sid];const x=sp(p,s.id);
  if(!S.p.qs){S.p.qs=shuffle(s.quiz).map(q=>({q:q.q,e:q.e,good:q.a[0],opts:shuffle(q.a)}));S.p.i=0;S.p.res=[];S.p.pick=null;}
  const Q=S.p;
  if(Q.i>=Q.qs.length){
    const sc=Q.res.filter(Boolean).length, pass=sc>=8, first=pass&&!x.done;
    x.quiz=Math.max(x.quiz||0,sc);if(pass){x.done=true;if(!x.srs)x.srs={box:1,due:addDays(1)};markDay(p);}save();
    const nx=SURAHS[s.idx+1];
    if(pass){confetti(240);setTimeout(()=>confetti(180),800);sfx('sourate');say(`Bravo ! ${sc} sur 10. Sourate terminée !`,2000);}else{sfx('bad');say(`${sc} sur 10. Presque ! Relis les cartes et réessaie.`);}
    view(`<div class="stack" style="align-items:center;text-align:center;margin-top:20px">
      <div class="${pass?'trophy':''}" style="font-size:4.4rem">${pass?'🏆':'💪'}</div><h2 class="title-gold" style="font-size:2.6rem">${sc} / 10</h2>
      <div class="paper" style="width:100%;box-sizing:border-box">${pass?`<h3 style="font-size:1.7rem;color:#9a5a12">${first?'Sourate terminée !':'Encore réussi !'}</h3><p>${first?(nx?`Tu as appris, compris et réussi <b>${esc(s.fr)}</b>. La porte de <b>${esc(nx.fr)}</b> est ouverte !`:'Tu as terminé tout le chemin. Quel voyage !'):'Tu connais bien cette sourate.'}</p>`
        :`<h3 style="font-size:1.7rem;color:#9a5a12">Presque !</h3><p>Il faut 8 bonnes réponses. Relis les cartes, puis réessaie : tu vas y arriver.</p>`}</div>
      ${pass?`<button class="btn turq block" data-map>${nx&&first?`🛤️ Vers ${esc(nx.fr)}`:'🛤️ Retour au chemin'}</button>`:`<button class="btn turq block" data-again>↻ Réessayer le quiz</button><button class="btn ghost block" data-cards>📜 Relire les cartes</button>`}</div>`);
    on(app,'[data-map]','click',()=>{S.hist=[];go('map',{},false);});
    on(app,'[data-again]','click',()=>{S.p={sid:s.id};render();});
    on(app,'[data-cards]','click',()=>{S.screen='cards';S.p={sid:s.id,i:0};render();});
    return;
  }
  const q=Q.qs[Q.i];
  const el=view(`<div class="topbar"><button class="iconbtn" data-back aria-label="Quitter">✕</button><div class="qdots" style="flex:1">${Q.qs.map((_,j)=>`<i class="${j<Q.i?(Q.res[j]?'ok':'ko'):j===Q.i?'cur':''}"></i>`).join('')}</div></div>
    <div class="stage-label">${esc(s.fr)} · Question ${Q.i+1} sur 10</div>
    <div class="paper qcard"><div class="qtext">${esc(q.q)}</div></div>
    <div class="opts">${q.opts.map((o,j)=>{let c='';if(Q.pick!==null){if(o===q.good)c='ok';else if(j===Q.pick)c='ko';}return `<button class="opt ${c}" data-o="${j}" ${Q.pick!==null?'disabled':''}><span class="l">${'ABCD'[j]}</span>${esc(o)}</button>`;}).join('')}</div>
    ${Q.pick!==null?`<div class="explain"><b>${q.opts[Q.pick]===q.good?'Bravo ! ':'Pas tout à fait. '}</b>${esc(q.e)}</div><button class="btn turq block" data-nq>${Q.i===9?'Voir mon score':'Question suivante ➜'}</button>`:''}`,'lesson');
  on(el,'[data-o]','click',(e,b)=>{Q.pick=+b.dataset.o;const ok=q.opts[Q.pick]===q.good;Q.res[Q.i]=ok;sfx(ok?'good':'bad');if(ok&&Math.random()<.5)say(pick(PRAISE),350);render();});
  on(el,'[data-nq]','click',()=>{Q.i++;Q.pick=null;render();});
};

/* ----- révisions ----- */

  const lbl=d=>{if(!d)return ['À réviser',''];if(d<=t)return ['À réviser',''];const n=Math.round((new Date(d)-new Date(t))/864e5);return [n===1?'Demain':`Dans ${n} jours`,'ok'];};

      :`<div class="empty panel"><div class="big">🌱</div><p>Quand tu auras appris ta première sourate, elle apparaîtra ici pour que tu ne l'oublies jamais.</p></div>`}`,'','rev');

  on(el,'[data-check]','click',()=>{R.reveal=true;render();setTimeout(()=>{const e2=app.firstElementChild;playList(s.id,list,v=>e2.querySelectorAll('.vline').forEach(d=>{const a=+d.dataset.v===v;d.classList.toggle('playing',a);if(a)d.scrollIntoView({block:'center',behavior:'smooth'});}));},50);});
  on(el,'[data-g]','click',(e,b)=>{const g=+b.dataset.g;const sr=x.srs||{box:1};if(g===2)sr.box=Math.min(sr.box+1,6);if(g===0)sr.box=1;sr.due=addDays(g===2?INT[sr.box]:1);x.srs=sr;markDay(p);save();chime(g?'ok':'tap');
    toast(g===2?`Super ! Prochaine révision ${INT[sr.box]===1?'demain':`dans ${INT[sr.box]} jours`}.`:g===1?'On la revoit demain.':'Pas grave, on la revoit demain.');back();});
};

/* ----- espace parents ----- */
SCREENS.parentGate=()=>{const kp=keypad(4,v=>{if(v===PARENT_CODE){S.screen='parent';S.p={};render();return true;}return false;},'Espace parents','Code parent');const el=view(`<div class="topbar"><button class="iconbtn" data-back aria-label="Retour">‹</button></div>${kp.html}`,'pinwrap');kp.bind(el);};
SCREENS.parent=()=>{
  const d=DB.data, st=d.settings;
  const sw=(k,t,sub)=>`<div class="row" style="justify-content:space-between"><div><b>${t}</b><div class="note">${sub}</div></div><button class="switch ${st[k]?'on':''}" data-set="${k}" aria-label="${t}"></button></div>`;
  const kids=d.profiles.map(p=>{const doneN=SURAHS.filter(s=>(p.surahs[s.id]||{}).done).length;
    return `<div class="panel kid"><div class="head"><span class="face">${AV.svg(p.av,{head:true,still:true})}</span><div style="flex:1;min-width:0"><b style="font-family:var(--display);font-size:1.4rem">${esc(p.name)}</b><div class="note">Code secret : <b>${esc(p.pin)}</b> · ${p.points} points (${p.earned||0} gagnés) · ${doneN}/${SURAHS.length} sourates terminées</div></div></div>
      <div class="bars">${SURAHS.map(s=>{const x=p.surahs[s.id]||{stage:0};const n=s.v.length;if(!x.stage&&!x.done)return '';return `<span>${s.emo} ${esc(s.fr)}</span><span class="bar"><i style="width:${(x.stage/n*100).toFixed(0)}%"></i></span><span class="small">${x.stage}/${n} v.${x.understood?' · compris':''}${x.quiz?` · quiz ${x.quiz}/10`:''}</span>`;}).join('')||'<span class="note" style="grid-column:1/-1">Pas encore commencé.</span>'}</div>
      ${MIC?`<div><b>Exigence du micro</b><div class="note">Part des mots qui doivent être reconnus pour valider une récitation.</div><div class="row" style="margin-top:8px;flex-wrap:wrap">${[[0.6,'Très souple'],[0.7,'Souple'],[0.8,'Normale'],[0.9,'Stricte']].map(([v,t])=>`<button class="toggle ${micLvl(p)===v?'on':''}" data-lvl="${v}" data-kid="${p.id}">${t} · ${Math.round(v*100)} %</button>`).join('')}</div></div>`:''}
      <div class="row" style="flex-wrap:wrap"><button class="btn ghost" data-pts="${p.id}" style="min-height:44px;font-size:1rem">+10 points</button><button class="btn ghost" data-del="${p.id}" style="min-height:44px;font-size:1rem">Supprimer…</button></div></div>`;}).join('');
  const el=view(`<div class="topbar"><button class="iconbtn" data-home aria-label="Fermer">✕</button><h2 style="flex:1;text-align:center" class="title-gold">Espace parents</h2><span style="width:48px"></span></div>
    <div class="panel stack">${sw('parentCheck','Validation parent à chaque verset','En plus du micro, vous tapez le code après chaque verset. La validation de fin de sourate est toujours demandée.')}${sw('sound','Sons et musique','Petites mélodies quand l\'enfant réussit ou se trompe.')}${sw('showAr','Afficher l\'arabe','Texte arabe des versets.')}${sw('showPh','Afficher la phonétique','Transcription en lettres latines.')}${sw('showFr','Afficher la traduction','Sens du verset en français.')}</div>
    <div class="sec-title">Enfants</div>${kids||'<p class="note">Aucun compte pour l\'instant.</p>'}
    <div class="sec-title">Sauvegarde</div>
    <div class="panel stack"><div class="note">${DB.cloud?'☁️ La progression est enregistrée sur votre compte Claude : elle se retrouve sur vos autres appareils.':'📱 La progression est enregistrée dans ce navigateur. Copiez une sauvegarde de temps en temps.'}</div>
      <button class="btn ghost" data-copy>📋 Copier une sauvegarde</button>
      <textarea id="bk" placeholder="Collez ici une sauvegarde pour la restaurer"></textarea><button class="btn ghost" data-restore>♻️ Restaurer</button></div>
    <p class="note" style="text-align:center">Les points : 5 par verset validé, 10 par sourate apprise.</p>`);
  on(el,'[data-home]','click',()=>{S.hist=[];go('home',{},false);});
  on(el,'[data-set]','click',(e,b)=>{st[b.dataset.set]=!st[b.dataset.set];if(!st.showAr&&!st.showPh)st.showPh=true;save();render();});
  on(el,'[data-lvl]','click',(e,b)=>{const p=d.profiles.find(x=>x.id===b.dataset.kid);p.micLevel=+b.dataset.lvl;save();render();toast(`Exigence de ${p.name} : ${Math.round(p.micLevel*100)} %`);});
  on(el,'[data-pts]','click',(e,b)=>{const p=d.profiles.find(x=>x.id===b.dataset.pts);addPoints(p,10);save();render();toast('+10 points');});
  on(el,'[data-del]','click',(e,b)=>{const p=d.profiles.find(x=>x.id===b.dataset.del);overlay(`<div class="panel stack"><h2>Supprimer ${esc(p.name)} ?</h2><p>Toute sa progression sera effacée.</p><div class="row"><button class="btn ghost" data-x style="flex:1">Annuler</button><button class="btn coral" data-y style="flex:1">Supprimer</button></div></div>`,o=>{on(o,'[data-x]','click',closeOverlay);on(o,'[data-y]','click',()=>{d.profiles=d.profiles.filter(x=>x.id!==p.id);save();render();});});});
  on(el,'[data-copy]','click',()=>{const txt=JSON.stringify(d);const ta=el.querySelector('#bk');try{navigator.clipboard.writeText(txt).then(()=>toast('Sauvegarde copiée'),()=>{ta.value=txt;ta.select();toast('Sélectionnez et copiez le texte');});}catch(e){ta.value=txt;ta.select();}});
  on(el,'[data-restore]','click',()=>{try{const v=JSON.parse(el.querySelector('#bk').value);if(!v.profiles)throw 0;DB.data=migrate(v);save();toast('Sauvegarde restaurée');render();}catch(e){toast('Ce texte n\'est pas une sauvegarde valide.');}});
};

/* ---------- démarrage ---------- */
render();
initRemote();

</script>
</body></html>
