<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Palais des Sourates</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sourates">
<meta name="theme-color" content="#0f1440">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;700&family=Amiri+Quran&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Monde : une nuit des Mille et Une Nuits — ciel indigo, or des lanternes, zellige turquoise, sable des dunes.
   Mise en page : une seule colonne centrée (max 760px), écrans plein cadre, barre d'onglets en bas. */
:root{
  --night:#0f1440; --night2:#1d1858; --plum:#3a1f63; --indigo:#2b2c86;
  --gold:#f4c542; --gold2:#ffe39a; --goldDk:#b9831f;
  --turq:#22b8b0; --turqDk:#13807b; --coral:#ff6f59; --rose:#ef6aa0; --mint:#3cc98f;
  --sand:#f7e6c4; --sand2:#e8c98e; --ink:#24122e; --cream:#fff8ea;
  --card:#fff8ea; --cardInk:#2a1636; --muted:#7c6a8c;
  --display:"Lalezar","Baloo Bhaijaan 2","Trebuchet MS",sans-serif;
  --body:"Baloo Bhaijaan 2","Trebuchet MS","Segoe UI",sans-serif;
  --quran:"Amiri Quran","Amiri","Scheherazade New","Geeza Pro",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:18px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--night)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
input{font:inherit}

/* ---------- ciel permanent ---------- */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(120% 70% at 50% 0%,#2a2a8a 0%,transparent 60%),
  linear-gradient(180deg,#0b1038 0%,#1a1656 45%,#3b1f66 80%,#5a2a6a 100%)}
#sky .pattern{position:absolute;inset:0;opacity:.035;background-image:var(--zellige);background-size:170px 170px}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.shoot{position:absolute;top:12%;left:-10%;width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(18deg);animation:shoot 9s linear infinite;opacity:0}
@keyframes shoot{0%,86%{opacity:0;transform:translate(0,0) rotate(18deg)}88%{opacity:1}96%{opacity:0;transform:translate(130vw,42vh) rotate(18deg)}100%{opacity:0}}
.moon{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 120px);right:5%;width:54px;height:54px;opacity:.9;filter:drop-shadow(0 0 18px rgba(255,236,170,.7))}

body.is-home .moon{display:block}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.screen.tabbed{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- typographie ---------- */
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.01em}
.title-gold{background:linear-gradient(180deg,#fff3c4 0%,#f4c542 45%,#c98a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(60,20,40,.55))}
.shimmer{background-size:100% 100%;position:relative}
.ar{font-family:var(--quran);direction:rtl}
.muted{color:#c9b8e6}
.small{font-size:.85rem}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:20px;font-family:var(--display);font-size:1.3rem;letter-spacing:.02em;color:#3a2108;background:linear-gradient(180deg,#ffe48a,#f4c542 55%,#e2a92c);box-shadow:0 6px 0 var(--goldDk),0 10px 22px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--goldDk),0 4px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.turq{color:#fff;background:linear-gradient(180deg,#4fe0d3,#22b8b0 55%,#159a93);box-shadow:0 6px 0 var(--turqDk),0 10px 22px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.coral{color:#fff;background:linear-gradient(180deg,#ff9a7d,#ff6f59 55%,#e5503c);box-shadow:0 6px 0 #a83524,0 10px 22px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.ghost{color:var(--cream);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.btn.ghost:active{transform:translateY(2px)}
.btn.block{width:100%}
.btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.iconbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);font-size:1.4rem}
.iconbtn:active{transform:scale(.94)}
.row{display:flex;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}

/* ---------- barre du haut ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;margin:-12px -16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,rgba(13,16,58,.96) 0%,rgba(13,16,58,.85) 70%,rgba(13,16,58,0) 100%)}
.topbar .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.topbar .face{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a3a9a,#1d1858);box-shadow:0 0 0 3px var(--gold),0 4px 10px rgba(0,0,0,.4);overflow:hidden;flex:none}
.topbar .name{font-family:var(--display);font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(10,8,40,.55);box-shadow:inset 0 0 0 2px rgba(244,197,66,.6);font-family:var(--display);font-size:1.2rem;color:var(--gold2);font-variant-numeric:tabular-nums}
.coin svg{width:26px;height:26px}
.coin.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.95)}}
.flame{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:1.15rem;color:#ffb86b}

/* ---------- barre d'onglets ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(15,12,50,0),rgba(15,12,50,.92) 30%)}
.tabs .inner{display:flex;gap:8px;width:100%;max-width:520px;padding:8px;border-radius:26px;background:rgba(30,22,80,.9);box-shadow:0 0 0 2px rgba(244,197,66,.45),0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:18px;font-family:var(--display);font-size:1rem;color:#cbbfe8;position:relative}
.tab .ic{font-size:1.6rem;line-height:1}
.tab.on{background:linear-gradient(180deg,#ffe48a,#f4c542);color:#3a2108;box-shadow:0 4px 0 var(--goldDk)}
.badge{position:absolute;top:2px;right:18%;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font-size:.85rem;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #1e1650;font-family:var(--body);font-weight:700}

/* ---------- accueil ---------- */
.home{align-items:center;text-align:center;gap:18px}
.lanterns{position:relative;height:120px;width:100%;max-width:560px;margin-top:-12px}
.lantern{position:absolute;top:0;transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.home h1{font-size:clamp(2.6rem,9vw,4.4rem)}
.home .sub{font-size:1.15rem;color:#e8dcff;max-width:30ch}
.profiles{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:100%}
.arch{width:150px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 14px;border-radius:80px 80px 22px 22px;background:linear-gradient(180deg,rgba(72,56,170,.75),rgba(40,26,100,.85));box-shadow:0 0 0 3px var(--gold),0 0 0 7px rgba(244,197,66,.18),0 14px 30px rgba(0,0,0,.45);transition:transform .2s}
.arch:active{transform:scale(.96)}
.arch .portrait{width:110px;height:110px;border-radius:55px 55px 18px 18px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#4e4fc4,#221c66)}
.arch .nm{font-family:var(--display);font-size:1.3rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .pts{font-size:.9rem;color:var(--gold2)}
.arch.add{background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(244,197,66,.6),inset 0 0 0 2px rgba(255,255,255,.08);border:0}
.arch.add .plus{width:110px;height:110px;display:grid;place-items:center;font-size:3.4rem;color:var(--gold)}
.palace{width:100%;max-width:620px;margin-top:auto;opacity:.95}

/* ---------- clavier PIN ---------- */
.pinwrap{align-items:center;text-align:center;gap:16px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--gold);transition:background .15s}
.dots i.on{background:var(--gold);box-shadow:0 0 12px rgba(244,197,66,.8)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.key{height:76px;border-radius:50%;font-family:var(--display);font-size:2rem;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:inset 0 0 0 2px rgba(244,197,66,.55),0 6px 14px rgba(0,0,0,.35)}
.key:active{transform:scale(.92);background:rgba(244,197,66,.35)}

/* ---------- cartes / panneaux ---------- */
.panel{background:linear-gradient(180deg,rgba(60,44,150,.55),rgba(34,22,90,.7));border-radius:26px;padding:18px;box-shadow:0 0 0 2px rgba(244,197,66,.35),0 12px 30px rgba(0,0,0,.35)}
.paper{background:var(--card);color:var(--cardInk);border-radius:26px;padding:20px;box-shadow:0 0 0 3px var(--gold),0 0 0 8px rgba(244,197,66,.2),0 16px 34px rgba(0,0,0,.4);position:relative}
.field{width:100%;box-sizing:border-box;min-height:60px;border-radius:18px;border:0;padding:0 18px;font-size:1.5rem;text-align:center;background:#fff8ea;color:#2a1636;box-shadow:inset 0 0 0 3px var(--gold);-webkit-user-select:text;user-select:text}

/* ---------- carte du chemin ---------- */
.map{position:relative;width:100%;margin:6px auto 0}
.map svg.road{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:96px;display:flex;flex-direction:column;align-items:center;gap:4px}
.node .med{width:84px;height:84px;position:relative;display:grid;place-items:center;transition:transform .2s}
.node .med svg{position:absolute;inset:0;width:100%;height:100%}
.node .med .emo{position:relative;font-size:2.1rem;line-height:1}
.node .lbl{font-family:var(--display);font-size:1.02rem;line-height:1.05;text-align:center;padding:3px 10px;border-radius:12px;background:rgba(20,14,60,.8);box-shadow:inset 0 0 0 1.5px rgba(244,197,66,.5);white-space:nowrap}
.node.locked .med{filter:grayscale(1) brightness(.65)}
.node.locked .lbl{opacity:.6}
.node.current .med{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(79,224,211,.6))}50%{transform:scale(1.08);filter:drop-shadow(0 0 18px rgba(79,224,211,.95))}}
.node:active .med{transform:scale(.92)}
.node .stars{position:absolute;bottom:-4px;right:-6px;font-size:1rem}
.hero-mini{position:absolute;width:74px;transform:translate(-50%,-92%);pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.hero-mini .avatar{width:100%;height:auto}

/* ---------- porte de sourate ---------- */
.gate{align-items:stretch;gap:16px}
.gate-head{text-align:center;padding:26px 16px 18px;border-radius:120px 120px 28px 28px;background:linear-gradient(180deg,rgba(86,62,190,.8),rgba(40,24,100,.9));box-shadow:0 0 0 3px var(--gold),0 0 0 9px rgba(244,197,66,.15),0 18px 40px rgba(0,0,0,.45);position:relative;overflow:hidden}
.gate-head .arname{font-family:var(--quran);font-size:3.2rem;line-height:1.3;color:var(--gold2);text-shadow:0 0 24px rgba(244,197,66,.5)}
.gate-head h2{font-size:2rem}
.gate-head .mean{color:#e8dcff}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);text-align:left;width:100%}
.step .ico{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:rgba(255,255,255,.1)}
.step .t{font-family:var(--display);font-size:1.2rem;line-height:1.1}
.step .d{font-size:.9rem;color:#c9b8e6}
.step.done .ico{background:linear-gradient(180deg,#ffe48a,#f4c542);color:#3a2108}
.step.cur{background:linear-gradient(90deg,rgba(34,184,176,.35),rgba(34,184,176,.12));box-shadow:inset 0 0 0 2px var(--turq),0 0 22px rgba(34,184,176,.35)}
.step.cur .ico{background:var(--turq);animation:pulse 1.8s infinite}
.step.lock{opacity:.5}
.step .go{margin-left:auto;font-family:var(--display);font-size:1.05rem;color:var(--gold2);white-space:nowrap}
.sec-title{font-family:var(--display);font-size:1.25rem;color:var(--gold2);margin-top:6px;display:flex;align-items:center;gap:10px}
.sec-title::before,.sec-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,rgba(244,197,66,.6),transparent)}

/* ---------- séance d'apprentissage ---------- */
.lesson{gap:14px}
.progress{height:14px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;flex:1}
.progress i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#4fe0d3,#f4c542);transition:width .5s}
.stage-label{font-family:var(--display);font-size:1.05rem;color:var(--gold2);text-align:center}
.inst{text-align:center;font-family:var(--display);font-size:1.7rem;line-height:1.15}
.inst small{display:block;font-family:var(--body);font-size:1rem;color:#d8ccf0;margin-top:4px}
.verse-card{position:relative;padding:26px 18px 20px;border-radius:30px;text-align:center;background:linear-gradient(180deg,#fff9ec,#f6e7c4);color:#2a1636;box-shadow:0 0 0 3px var(--gold),0 0 0 9px rgba(244,197,66,.18),0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.verse-card::before{content:"";position:absolute;inset:0;opacity:.08;background-image:var(--zellige-ink);background-size:90px 90px;pointer-events:none}
.verse-card .num{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:40px;height:40px}
.v-ar{font-family:var(--quran);direction:rtl;font-size:clamp(2rem,6.5vw,2.9rem);line-height:2;color:#1c0f2a;margin-top:18px;position:relative}
.v-ph{font-size:clamp(1.25rem,4vw,1.6rem);font-weight:700;color:#5b2a7a;margin-top:6px;position:relative}
.v-fr{font-size:1.05rem;color:#7c6a8c;margin-top:8px;font-style:italic;position:relative}
.w{display:inline-block;transition:all .3s}
.w.hid{color:transparent!important;background:repeating-linear-gradient(90deg,rgba(185,131,31,.55) 0 8px,transparent 8px 12px) bottom/100% 3px no-repeat;border-radius:4px;cursor:pointer;min-width:1.6em}
.w.peek{color:#c9962a!important;background:none}
.chain{display:flex;flex-direction:column;gap:10px}
.chain .vline{padding:12px 16px;border-radius:20px;background:rgba(255,248,234,.92);color:#2a1636;box-shadow:inset 0 0 0 2px rgba(244,197,66,.5);text-align:center;transition:all .3s}
.chain .vline.playing{background:#fff;box-shadow:0 0 0 3px var(--turq),0 0 24px rgba(79,224,211,.6);transform:scale(1.02)}
.chain .vline .v-ar{font-size:clamp(1.5rem,5vw,2.1rem);margin-top:0;line-height:1.9}
.chain .vline .v-ph{font-size:1.1rem;margin-top:0}
.listen-orb{position:relative;width:150px;height:150px;margin:6px auto;display:grid;place-items:center}
.listen-orb .core{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:3rem;background:radial-gradient(circle at 40% 35%,#fff3c4,#f4c542 60%,#c98a1f);box-shadow:0 0 30px rgba(244,197,66,.7),0 8px 0 var(--goldDk);position:relative;z-index:2}
.listen-orb .ring{position:absolute;inset:20px;border-radius:50%;border:3px solid rgba(244,197,66,.7);opacity:0}
.listen-orb.on .ring{animation:ripple 2s ease-out infinite}
.listen-orb.on .ring:nth-child(2){animation-delay:.66s}.listen-orb.on .ring:nth-child(3){animation-delay:1.33s}
@keyframes ripple{from{transform:scale(.8);opacity:.9}to{transform:scale(1.7);opacity:0}}
.listen-orb.you .core{background:radial-gradient(circle at 40% 35%,#c8fff8,#22b8b0 60%,#13807b);box-shadow:0 0 30px rgba(79,224,211,.7),0 8px 0 var(--turqDk)}
.count-ring{position:absolute;inset:0;transform:rotate(-90deg)}
.count-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.rounds{display:flex;gap:10px;justify-content:center}
.rounds i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2)}
.rounds i.on{background:var(--gold);box-shadow:0 0 10px rgba(244,197,66,.8)}
.ctrls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.toggle{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);font-size:.95rem}
.toggle.on{background:rgba(244,197,66,.22);box-shadow:inset 0 0 0 2px var(--gold)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rate .btn{font-size:1.1rem;padding:0 12px;min-height:64px}

/* ---------- comprendre (cartes à balayer) ---------- */
.deck{position:relative;flex:1;min-height:380px;display:flex;align-items:stretch;touch-action:pan-y}
.ccard{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:30px 22px 26px;border-radius:34px;background:linear-gradient(180deg,#fff9ec,#f4e2bb);color:#2a1636;text-align:center;box-shadow:0 0 0 3px var(--gold),0 0 0 9px rgba(244,197,66,.16),0 18px 40px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;overflow:hidden}
.ccard::before{content:"";position:absolute;inset:0;opacity:.07;background-image:var(--zellige-ink);background-size:90px 90px;pointer-events:none}
.ccard .art{width:96px;height:96px;margin:0 auto}
.ccard .kind{font-family:var(--display);font-size:1.15rem;color:#9a5a12;letter-spacing:.03em}
.ccard .txt{font-size:clamp(1.3rem,3.4vw,1.9rem);line-height:1.45;font-weight:600;position:relative}
.ccard.morale{background:linear-gradient(180deg,#2c2380,#1a1450);color:var(--cream)}
.ccard.morale .kind{color:var(--gold2)}
.ccard.morale .txt{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4.6vw,2rem);color:var(--gold2)}
.ccard.word .bigar{font-family:var(--quran);font-size:4rem;color:#1c0f2a;line-height:1.5}

 "Chaque fois que le Prophète récitait un verset, un nœud se défaisait et finalement, la sorcellerie disparut."}, {"k": "lesson", "t": "Un remède pour ton cœur", "x": "C'est un remède pour ton cœur contre le mal des êtres invisibles, qui n'ont aucun pouvoir si tu sais te protéger et te réfugier auprès d'Allah."}, {"k": "lesson", "t": "Un remède pour ton cœur", "x": "N'oublie jamais que c'est Allah qui a tous les pouvoirs et qu'Il commande à qui Il veut. Les djinns sont des êtres faibles, et ils ne s'attaquent qu'aux êtres faibles."}, {"k": "lesson", "t": "Un remède pour ton cœur", "x": "Jamais ils n'oseront s'approcher d'une personne qui aime Allah et qui Lui obéit, surtout si elle se protège en récitant ces sourates tous les jours, après chaque prière et le soir avant de s'endormir."}, {"k": "lesson", "t": "Se protéger auprès d'Allah", "x": "Parfois Chaytan te pousse à ressentir des sentiments négatifs pour que tu ne penses pas à Allah. Ces deux sourates sont comme un médicament contre les maladies que ton cœur peut subir."}, {"k": "lesson", "t": "Se protéger auprès d'Allah", "x": "Si tu as peur, si tu es trop triste ou inquiet, pense à les réciter en étant persuadé qu'Allah te protégera du mal des diables."}, {"k": "lesson", "t": "Se protéger auprès d'Allah", "x": "Quand tu sens que quelqu'un te veut du mal, demande à Allah de te protéger en récitant chaque jour avant de te coucher les deux dernières sourates du Coran. Et rien ne pourra t'arriver !"}, {"k": "lesson", "t": "Se protéger auprès d'Allah", "x": "Il faut avoir confiance en Allah et ne pas avoir peur, car c'est Lui le plus puissant et le plus fort, et Il maîtrise toutes Ses créatures, même les plus méchantes."}, {"k": "word", "t": "Le mot à retenir", "ar": "حَسَدٌ", "tr": "ḥasad", "x": "La jalousie"}, {"k": "box", "t": "D'où vient le MAL ?", "x": "Allah a créé le bien et le mal, pour que les hommes puissent faire le bon choix et décider de rester attachés à leur nature première (la fiṭra) et être dans le bien. Allah est le Bon, et Il aime ce qui est bon."}, {"k": "box", "t": "D'où vient le MAL ?", "x": "Et Il aime quand tu restes sur le droit chemin, en L'adorant et en faisant le bien autour de toi."}, {"k": "box", "t": "Comment te protéger du MAL INVISIBLE ?", "x": "Pense très souvent à Allah, protège-toi avec la prière, sois chaque jour en lien avec le Coran. Et surtout n'aie pas peur, Allah est plus fort que tout."}, {"k": "tip", "t": "Mon conseil", "x": "As-tu appris par cœur la sourate al-Falaq et la sourate an-Nâs ? Essaie, tu verras, c'est très facile !"}, {"k": "tip", "t": "Mon conseil", "x": "Surtout, n'oublie pas de les réciter avant de t'endormir."}, {"k": "tip", "t": "Mon conseil", "x": "Si tu le peux, récite-les aussi le matin, elles te protégeront toute la journée inchallah."}, {"k": "morale", "t": "La morale à garder", "x": "Quand j'ai peur ou que je me sens menacé, je me réfugie auprès d'Allah : Il est plus fort que tout. Je récite les deux protectrices avant de dormir."}], "quiz": [{"q": "Que veut dire « al-falaq » ?", "a": ["La pointe de l'aube", "La nuit noire", "Le soleil du midi", "La pluie"], "e": "Le nom de la sourate signifie « la pointe de l'aube »."}, {"q": "Comment appelle-t-on al-Falaq et an-Nâs ensemble ?", "a": ["Les deux protectrices", "Les deux lumières", "Les deux guides", "Les deux voisines"], "e": "On les appelle al-maw`idhatân : elles protègent celui qui les récite régulièrement."}, {"q": "Combien y avait-il de nœuds sur la corde du mauvais sort ?", "a": ["Onze", "Sept", "Neuf", "Treize"], "e": "La corde avait onze nœuds, et al-Falaq et an-Nâs contiennent onze versets : un pour chaque nœud."}, {"q": "Qui trouva la corde sous une roche dans le puits ?", "a": ["`Ammâr ibn Yasîr", "Abou Bakr", "`Omar", "Bilâl"], "e": "Le Prophète ﷺ envoya son ami fidèle `Ammâr ibn Yasîr."}, {"q": "Qui est venu délivrer le Prophète ﷺ avec ces deux sourates ?", "a": ["L'ange Jibrîl", "Abou Lahab", "Un voisin", "Un médecin"], "e": "C'est l'ange Jibrîl qui, sur ordre d'Allah, lui apporta ces sourates."}, {"q": "Que veut dire « ḥasad » ?", "a": ["La jalousie", "La peur", "La patience", "La générosité"], "e": "ḥasad, c'est la jalousie : Allah nous demande de nous protéger de la méchanceté du jaloux."}, {"q": "Les djinns, d'après le livre, sont des êtres…", "a": ["Faibles, qui ne s'attaquent qu'aux êtres faibles", "Plus forts qu'Allah", "Impossibles à repousser", "Qui obéissent aux sorciers"], "e": "Les djinns n'osent pas s'approcher de celui qui aime Allah et se protège avec ces sourates."}, {"q": "Quand est-il recommandé de réciter ces sourates ?", "a": ["Après chaque prière et le soir avant de dormir", "Seulement au Ramadan", "Seulement à l'école", "Une fois par an"], "e": "Tous les jours, après chaque prière et le soir avant de s'endormir (et le matin si possible)."}, {"q": "Pourquoi Allah a-t-Il créé le bien et le mal ?", "a": ["Pour que les hommes fassent le bon choix", "Pour nous faire peur", "Parce qu'Il s'est trompé", "Pour rien"], "e": "Les hommes peuvent choisir de rester attachés à leur nature première (la fiṭra) et d'être dans le bien."}, {"q": "Que dois-tu faire si tu as peur, ou si tu es triste ou inquiet ?", "a": ["Réciter ces sourates en ayant confiance en Allah", "Cacher ta peur", "Ne plus sortir", "Attendre sans rien faire"], "e": "Ces sourates sont comme un médicament pour ton cœur : Allah te protégera."}]}, {"id": 114, "ar": "الناس", "fr": "An-Nâs", "mean": "Les hommes", "emo": "🛡️", "v": [{"ar": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ", "ph": "qoul a`oûdhou bi-rabbi n-nâs", "fr": "Dis : « Je me réfugie auprès du Seigneur des hommes,"}, {"ar": "مَلِكِ النَّاسِ", "ph": "maliki n-nâs", "fr": "le roi des hommes,"}, {"ar": "إِلَٰهِ النَّاسِ", "ph": "ilâhi n-nâs", "fr": "le Dieu des hommes,"}, {"ar": "مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ", "ph": "min charri-l-waswâsi-l-khannâs", "fr": "contre les tentations du démon"}, {"ar": "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ", "ph": "alladhî youwaswisou fî ṣoudoûri n-nâs", "fr": "qu'il murmure dans le cœur des hommes,"}, {"ar": "مِنَ الْجِنَّةِ وَالنَّاسِ", "ph": "mina-l-jinnati wa n-nâs", "fr": "que ce démon fasse partie des djinns ou des hommes. »"}], "cards": [{"k": "theme", "t": "Le thème", "x": "Allah a révélé cette sourate pour nous ordonner, à nous les hommes, de chercher Sa protection contre le mal des autres créatures, que ce soient des êtres humains ou des djinns."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Le Prophète ﷺ tomba malade. Il savait que quelque chose d'anormal se passait, sans savoir de quoi il s'agissait."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Mais il savait qu'on cherchait à lui faire du mal. Un soir, deux anges vinrent le voir et lui ordonnèrent d'aller dans l'un des puits de la cité."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Il envoya son ami fidèle `Ammâr ibn Yasîr, qui trouva sous une roche un mauvais sort : une corde sur laquelle il y avait onze nœuds."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "C'est alors qu'Allah révéla les deux dernières sourates – an-Nâs et al-Falaq –, contenant onze versets : un pour chaque nœud."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Chaque fois que le Prophète récitait un verset, un nœud se défaisait et finalement, la sorcellerie disparut."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Connais-tu l'histoire du prophète Adam ? C'est le premier homme qu'Allah a créé."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Notre Seigneur l'a fait de terre, un peu comme une statue, puis Il lui a insufflé de Son souffle. Chaque homme a une part du souffle d'Allah en lui, même toi !"}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "C'est pour cela qu'Allah demanda aux anges de se prosterner devant Sa nouvelle créature."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Les anges sont tous obéissants, donc ils se prosternèrent tous. Mais Chaytan, lui, était un démon."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Même s'il adorait Allah, il ne supportait pas de devoir se prosterner devant une autre créature, car il était persuadé d'être meilleur qu'Adam. Il refusa en disant : « Non, je suis meilleur que lui ! »"}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Il fit preuve d'orgueil, et c'est le défaut qu'Allah déteste le plus."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Alors Allah décida de punir Chaytan et lui promit de le jeter en enfer. Mais le diable est un être malfaisant et rancunier."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Au lieu de reconnaître sa faute, il se mit en colère contre l'homme et jura d'emmener en enfer autant d'hommes et de femmes que possible."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Il commença par inciter Adam et son épouse Ḥawwa à désobéir à Allah en mangeant un fruit de l'arbre qu'Allah leur avait interdit. Allah les mit alors sur terre pour vivre une vie plus difficile."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "Depuis cette première confrontation, le diable n'arrête pas de tout faire pour convaincre les gens de ne pas écouter Allah."}, {"k": "lesson", "t": "Chaytan est notre ennemi", "x": "C'est pour cela qu'Allah a révélé cette sourate, pour que tu puisses Lui demander de te protéger contre les mauvais conseils que le diable te chuchote."}, {"k": "word", "t": "Le mot à retenir", "ar": "مَلِكٌ", "tr": "malik", "x": "Le roi des rois, c'est-à-dire Allah !"}, {"k": "box", "t": "Qu'est-ce qu'un DJINN ?", "x": "Un djinn est, comme nous, une créature qu'Allah a créée. Le djinn est fait de feu et on ne peut pas le voir."}, {"k": "tip", "t": "Mon conseil", "x": "Quand tu sens que Chaytan te murmure de mauvais conseils, dis : « a`oûdhou billâh min ach-chayṭân ar-rajîm » (je me réfugie auprès d'Allah contre Chaytan le maudit)."}, {"k": "tip", "t": "Mon conseil", "x": "Si tu fais le mal, regrette-le aussitôt et demande pardon à Allah en disant « astaghfiroullâh » autant que tu peux. Enfin, promets-toi de ne plus recommencer."}, {"k": "tip", "t": "Mon conseil", "x": "Surtout, fais tes cinq prières quotidiennes, elles sont une protection pour toi contre le diable."}, {"k": "morale", "t": "La morale à garder", "x": "Quand Chaytan me murmure de mauvaises idées, je dis « a`oûdhou billâh min ach-chayṭân ar-rajîm ». Si je fais une bêtise, je demande pardon et je fais mes prières."}], "quiz": [{"q": "Que veut dire « an-Nâs » ?", "a": ["Les hommes", "Les anges", "Les djinns", "Les animaux"], "e": "an-Nâs signifie « les hommes »."}, {"q": "Que veut dire « malik » ?", "a": ["Le roi des rois, c'est-à-dire Allah", "Un ange", "Un voyageur", "Un prophète"], "e": "malik, c'est le roi des rois : Allah."}, {"q": "De quoi est fait le premier homme, Adam ?", "a": ["De terre", "De feu", "De lumière", "D'eau de pluie"], "e": "Allah a fait Adam de terre, puis lui a insufflé de Son souffle."}, {"q": "Pourquoi Chaytan a-t-il refusé de se prosterner devant Adam ?", "a": ["Par orgueil : il se croyait meilleur", "Il avait peur", "Il ne l'avait pas entendu", "Il était malade"], "e": "Il a dit : « Je suis meilleur que lui ! » L'orgueil est le défaut qu'Allah déteste le plus."}, {"q": "Quel défaut Allah déteste-t-Il le plus ?", "a": ["L'orgueil", "La timidité", "La lenteur", "La fatigue"], "e": "Chaytan a fait preuve d'orgueil, c'est le défaut qu'Allah déteste le plus."}, {"q": "De quoi est fait un djinn ?", "a": ["De feu", "De terre", "De lumière", "D'eau"], "e": "Le djinn est fait de feu et on ne peut pas le voir."}, {"q": "Que dire quand Chaytan te murmure de mauvais conseils ?", "a": ["a`oûdhou billâh min ach-chayṭân ar-rajîm", "bismillâh seulement", "astaghfiroullâh seulement", "Rien du tout"], "e": "Cela veut dire : je me réfugie auprès d'Allah contre Chaytan le maudit."}, {"q": "Que faire si tu as fait le mal ?", "a": ["Le regretter, demander pardon et ne plus recommencer", "L'oublier", "Le cacher à Allah", "Accuser quelqu'un d'autre"], "e": "Dis « astaghfiroullâh » et promets-toi de ne plus recommencer."}, {"q": "Combien de versets contiennent al-Falaq et an-Nâs en tout ?", "a": ["Onze", "Dix", "Douze", "Sept"], "e": "Onze versets pour les onze nœuds de la corde."}, {"q": "Qu'est-ce qui te protège aussi du diable ?", "a": ["Tes cinq prières quotidiennes", "Un cadeau", "Le sommeil", "Les jeux vidéo"], "e": "Les cinq prières sont une protection contre le diable."}]}, {"id": 108, "ar": "الكوثر", "fr": "Al-Kawthar", "mean": "Les faveurs", "emo": "🌊", "v": [{"ar": "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ", "ph": "innâ a`ṭaynâka-l-kawthar", "fr": "Nous t'avons comblé de faveurs."}, {"ar": "فَصَلِّ لِرَبِّكَ وَانْحَرْ", "ph": "fa-ṣalli li-rabbika wa-nḥar", "fr": "Prie donc ton Seigneur et sacrifie !"}, {"ar": "إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ", "ph": "inna châni'aka houwa-l-abtar", "fr": "Celui qui te hait se retrouvera privé de descendance."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Cette sourate nous encourage à prier et à montrer à Allah notre amour et notre reconnaissance pour tout ce qu'Il nous donne."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Le Prophète ﷺ venait d'avoir un petit garçon, qu'il appela `Abdallah. Notre bien-aimé était heureux et reconnaissant."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Mais Allah avait décidé d'éprouver notre Prophète : le jeune `Abdallah n'avait pas encore deux ans qu'Allah décida de le faire mourir. Le Prophète en était très triste, mais il s'en remit à son Seigneur."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Son oncle Abou Lahab, qui était aussi son voisin, aurait dû être triste pour lui."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Mais au lieu de cela, quand il apprit la mort du fils du Prophète, le cruel Abou Lahab sortit dans les rues en chantant et criant : « Moḥammad n'a pas de descendance ! », car à l'époque la descendance passait par les garçons."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Alors Allah le rassura et lui envoya ces trois petits versets, tel un immense trésor, pour lui rappeler de ne jamais oublier l'essentiel : notre plus grand bien, c'est notre relation à Allah. Il est Celui qui donne sans compter."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Ensuite Il lui demanda de sacrifier une bête en offrande. Enfin, Allah lui dit de ne pas faire attention aux moqueries des gens de son peuple."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Il promit aussi que celui qui s'était moqué du Prophète, Abou Lahab, n'aurait pas de descendance."}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "Jamais tu ne pourras compter toutes les faveurs dont Allah t'a comblé. Grâce à Lui, tu manges, tu bois, tu as des vêtements, des parents et une famille."}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "Allah t'a donné un corps pour jouer, te déplacer et agir, un cerveau pour réfléchir, un cœur pour ressentir."}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "Chaque chose que tu vois, que tu entends, que tu sens, chaque émotion, chaque pensée, chaque occasion : toutes ces choses sont des faveurs qu'Allah t'a données."}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "Allah ne te demande pas grand-chose en échange, Il ne veut pas d'argent, ni que tu travailles pour Lui. Il veut seulement que tu L'aimes et qu'Il soit ce qui compte le plus pour toi. Comment Lui montrer combien nous L'adorons ?"}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "D'abord par la prière, car Allah aime qu'on Le prie, ensuite par tous les actes de bien : se montrer gentil, être bon envers ses parents, faire des cadeaux à sa famille et ses amis, donner des aumônes aux pauvres, etc."}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "Même si le Prophète ﷺ a beaucoup souffert dans sa vie, il savait qu'Allah l'aimait et qu'Il lui donnait beaucoup de bien aussi."}, {"k": "lesson", "t": "Remercier Allah pour Ses faveurs", "x": "Et la meilleure chose qu'Il lui ait donnée, c'est une grande communauté : il existe des milliards de musulmans aujourd'hui. Le Prophète n'a donc peut-être pas eu de garçons, mais il a une immense communauté. Al-ḥamdoulillâh !"}, {"k": "word", "t": "Le mot à retenir", "ar": "رَبٌّ", "tr": "rabb", "x": "Dieu"}, {"k": "box", "t": "Que veut dire « SACRIFIER » ?", "x": "On sacrifie un animal à Allah, pour Lui faire une offrande. Allah veut voir ainsi l'amour que l'on a pour Lui, comme l'a fait le prophète Ibrahim."}, {"k": "tip", "t": "Mon conseil", "x": "N'oublie pas tout ce qu'Allah te donne chaque jour. Remercie-Le en disant al-ḥamdoulillâh et en faisant de belles prières."}, {"k": "tip", "t": "Mon conseil", "x": "Ne rate jamais ta prière, c'est ton plus grand trésor car c'est elle qui te rapproche le plus d'Allah."}, {"k": "tip", "t": "Mon conseil", "x": "Si une personne t'insulte ou te dit de mauvaises choses, ne t'inquiète pas, Allah voit tout."}, {"k": "tip", "t": "Mon conseil", "x": "Tu peux la remettre à sa place sans t'abaisser à l'insulter toi aussi, mais tu peux aussi laisser Allah faire, car Allah juge les actes de quiconque fait du mal."}, {"k": "morale", "t": "La morale à garder", "x": "Allah me comble de faveurs que je ne pourrai jamais compter : je Le remercie (al-ḥamdoulillâh), je ne rate jamais ma prière, et je ne me laisse pas atteindre par les moqueries."}], "quiz": [{"q": "Que veut dire « al-Kawthar » ?", "a": ["Les faveurs", "Les étoiles", "Les rivières", "Les chameaux"], "e": "Le livre traduit le nom de la sourate par « les faveurs »."}, {"q": "Comment le Prophète ﷺ appela-t-il son petit garçon ?", "a": ["`Abdallah", "Ibrahim", "Ismaïl", "`Alî"], "e": "Le Prophète ﷺ venait d'avoir un petit garçon qu'il appela `Abdallah."}, {"q": "Qui se moqua du Prophète à la mort de son fils ?", "a": ["Abou Lahab", "Abou Bakr", "`Ammâr", "Walid"], "e": "Abou Lahab, son oncle et voisin, cria : « Moḥammad n'a pas de descendance ! »"}, {"q": "Pourquoi Abou Lahab disait-il que le Prophète n'avait pas de descendance ?", "a": ["Parce qu'à l'époque la descendance passait par les garçons", "Parce que le Prophète n'avait pas d'amis", "Parce que le Prophète était parti", "Parce qu'il était fâché"], "e": "À l'époque, on pensait que seule la descendance par les garçons comptait."}, {"q": "Combien de versets compte cette sourate ?", "a": ["Trois", "Un", "Cinq", "Dix"], "e": "Allah lui envoya ces trois petits versets, tel un immense trésor."}, {"q": "Que veut dire « rabb » ?", "a": ["Dieu", "Roi", "Éléphant", "Montagne"], "e": "rabb signifie « Dieu » (le Seigneur)."}, {"q": "Quel est notre plus grand bien selon la sourate ?", "a": ["Notre relation à Allah", "Notre argent", "Nos jouets", "Notre maison"], "e": "Allah rappelle de ne jamais oublier l'essentiel : notre relation à Allah."}, {"q": "Que veut dire « sacrifier » ?", "a": ["Offrir un animal à Allah pour montrer son amour", "Jeter de la nourriture", "Partir en voyage", "Jeûner"], "e": "Allah veut voir ainsi l'amour que l'on a pour Lui, comme l'a fait le prophète Ibrahim."}, {"q": "Comment montrer à Allah qu'on L'aime ?", "a": ["Par la prière et les actes de bien", "En criant fort", "En ne faisant rien", "En gardant tout pour soi"], "e": "D'abord par la prière, puis par tous les actes de bien : gentillesse, aumône, cadeaux..."}, {"q": "Que faire si quelqu'un t'insulte ?", "a": ["Ne pas t'inquiéter : Allah voit tout", "T'insulter toi aussi", "Pleurer pendant des jours", "Arrêter de prier"], "e": "Tu peux le remettre à sa place sans insulter, ou laisser Allah faire : Il juge les actes de celui qui fait du mal."}]}, {"id": 110, "ar": "النصر", "fr": "An-Naṣr", "mean": "Le secours", "emo": "🏆", "v": [{"ar": "إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ", "ph": "idhâ jâ'a naṣrou Llâhi wa-l-fatḥ", "fr": "Quand le secours d'Allah viendra ainsi que la victoire,"}, {"ar": "وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا", "ph": "wa ra'ayta n-nâsa yadkhouloûna fî dîni Llâhi afwâjâ", "fr": "Et que tu verras les gens entrer en grand nombre dans la religion d'Allah,"}, {"ar": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا", "ph": "fa-sabbiḥ bi-ḥamdi rabbika wa-staghfirhou innahou kâna tawwâbâ", "fr": "Alors glorifie ton Seigneur et demande-Lui pardon, car Il entend et accepte quand on Lui demande pardon."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah promet au Prophète ﷺ de lui apporter Son aide. Il lui annonce aussi qu'Il battra ses ennemis et que beaucoup de gens deviendront musulmans."}, {"k": "theme", "t": "Le thème", "x": "Alors Allah demande à Ses serviteurs de Le glorifier, de Le reconnaître comme Seigneur et de Lui demander pardon."}, {"k": "theme", "t": "Le thème", "x": "Cette sourate marque aussi la fin de la mission du Prophète : Allah lui fait comprendre qu'il est bientôt temps pour lui de rejoindre son Seigneur."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Cela faisait dix ans que le Prophète ﷺ avait été chassé de La Mecque. Mais la situation avait bien changé : Médine était une cité musulmane et de plus en plus de Mecquois se convertissaient à l'islam."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Un jour, Allah ordonna au Prophète de se rendre à La Mecque avec une armée de dix mille hommes pour la reconquérir."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Le Prophète fit une entrée très sage dans la cité qui l'avait vu naître. Il baissait la tête en signe d'humilité sur sa chamelle et promit de ne pas faire couler le sang."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Tous les Mecquois furent impressionnés de sa clémence, et il ne retira ni richesse ni privilège. Cela donna aux gens l'envie de connaître la religion de leur ami Moḥammad et encore plus de gens se convertirent à l'islam."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "C'est pourquoi Allah a révélé la sourate an-Naṣr."}, {"k": "lesson", "t": "Allah est le Meilleur soutien", "x": "Le Prophète Moḥammad a vécu beaucoup d'épreuves durant sa vie : il a été chassé de sa maison, lui ainsi que les musulmans ; beaucoup de gens qu'il aimait sont morts ; ses ennemis le combattaient sans relâche et l'insultaient."}, {"k": "lesson", "t": "Allah est le Meilleur soutien", "x": "Mais, malgré tout cela, le Prophète a continué d'obéir à son Seigneur. Alors Allah lui a révélé cette courte sourate pour lui annoncer que la victoire était proche et que la vérité allait éclater au grand jour. Allah lui a promis de protéger l'islam."}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Le Prophète et tous les musulmans doivent glorifier Allah, c'est-à-dire répéter soubḥanallâh, et faire Ses louanges, et dire al-ḥamdoulillâh pour Le reconnaître et Le remercier comme il se doit, car Il est le Seigneur de l'univers et c'est Lui qui a donné la victoire aux musulmans."}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Allah demande aussi de Lui demander souvent pardon, en disant par exemple astaghfiroullâh (je demande pardon à Allah). Pourquoi demander pardon ?"}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Parce que, même sans nous en rendre compte, nous n'adorons pas Allah comme il se doit. Nous faisons parfois des bêtises, parfois des péchés."}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Mais, même quand ce n'est pas le cas, nous oublions parfois Allah, alors que nous devrions toujours L'avoir dans le cœur et Le remercier."}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Il arrive à tout le monde d'oublier, mais c'est pour cela qu'Allah t'incite à Lui demander pardon, pour qu'Il te pardonne même tes oublis."}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Surtout, Il veut que tu fasses preuve de modestie devant Lui et que tu n'oublies pas que tu es une créature comme les autres."}, {"k": "lesson", "t": "Glorifier Allah et Lui demander pardon", "x": "Tu n'es supérieur à personne, alors demande pardon à Celui qui t'a créé et qui, Lui, est au-dessus de toutes les créatures. Enfin, le musulman doit toujours faire confiance en Allah et ne doit pas désespérer."}, {"k": "word", "t": "Le mot à retenir", "ar": "تَوَّابٌ", "tr": "at-tawwâb", "x": "Celui qui pardonne à quiconque regrette et demande pardon. C'est l'un des noms d'Allah."}, {"k": "word", "t": "Le mot à retenir", "ar": "دِينٌ", "tr": "dîn", "x": "Religion"}, {"k": "box", "t": "Ça veut dire quoi GLORIFIER ?", "x": "Allah aime qu'on reconnaisse Sa puissance, Il veut donc qu'on Le glorifie pour nous rappeler qu'Il est le Maître et que nous sommes Ses serviteurs. On glorifie Allah par la parole soubḥân Allah."}, {"k": "tip", "t": "Mon conseil", "x": "Sois humble et ne te sens pas supérieur aux autres, car Allah n'aime pas les arrogants."}, {"k": "tip", "t": "Mon conseil", "x": "Pense à remercier Allah en toutes circonstances en répétant al-ḥamdoulillâh."}, {"k": "tip", "t": "Mon conseil", "x": "Demande souvent pardon à Allah, car tu es un être humain et, comme tout le monde, il t'arrive de faire des bêtises."}, {"k": "morale", "t": "La morale à garder", "x": "Je reste humble quand je réussis : je glorifie Allah (soubḥân Allah), je Le remercie (al-ḥamdoulillâh) et je Lui demande pardon (astaghfiroullâh). Je ne me sens supérieur à personne."}], "quiz": [{"q": "Que veut dire « an-Naṣr » ?", "a": ["Le secours", "Le pardon", "La montagne", "Le voyage"], "e": "an-Naṣr signifie « le secours »."}, {"q": "Combien d'hommes comptait l'armée qui alla à La Mecque ?", "a": ["Dix mille", "Mille", "Cent", "Un million"], "e": "Allah ordonna au Prophète de s'y rendre avec une armée de dix mille hommes."}, {"q": "Comment le Prophète ﷺ entra-t-il à La Mecque ?", "a": ["La tête baissée sur sa chamelle, avec humilité", "En criant victoire", "En courant", "En secret la nuit"], "e": "Il baissait la tête en signe d'humilité et promit de ne pas faire couler le sang."}, {"q": "Que provoqua la clémence du Prophète chez les Mecquois ?", "a": ["Encore plus de gens devinrent musulmans", "Ils s'enfuirent", "Ils se fâchèrent", "Rien du tout"], "e": "Cela leur donna l'envie de connaître la religion de leur ami Moḥammad."}, {"q": "Que veut dire « at-tawwâb » ?", "a": ["Celui qui pardonne à quiconque regrette", "Celui qui punit", "Celui qui voit tout", "Celui qui est le plus fort"], "e": "C'est l'un des noms d'Allah."}, {"q": "Que veut dire « dîn » ?", "a": ["Religion", "Terre", "Nuit", "Argent"], "e": "dîn signifie « religion »."}, {"q": "Comment glorifie-t-on Allah ?", "a": ["En disant soubḥân Allah", "En restant silencieux", "En criant fort", "En voyageant"], "e": "On glorifie Allah par la parole soubḥân Allah."}, {"q": "Que dit-on pour demander pardon à Allah ?", "a": ["Astaghfiroullâh", "Allâhou akbar seulement", "Bismillâh seulement", "Rien"], "e": "astaghfiroullâh veut dire « je demande pardon à Allah »."}, {"q": "Pourquoi Allah veut-Il que nous Lui demandions pardon ?", "a": ["Pour qu'Il nous pardonne même nos oublis et que nous restions humbles", "Parce qu'Il est fâché contre nous", "Parce que nous ne faisons jamais d'erreur", "Pour nous punir"], "e": "Il arrive à tout le monde d'oublier : demander pardon rend humble et Allah pardonne."}, {"q": "Que marque aussi cette sourate pour le Prophète ﷺ ?", "a": ["La fin de sa mission", "Le début de sa mission", "Un long voyage", "Sa naissance"], "e": "Allah lui fait comprendre qu'il est bientôt temps pour lui de rejoindre son Seigneur."}]}, {"id": 103, "ar": "العصر", "fr": "Al-`Aṣr", "mean": "Le temps", "emo": "⏳", "v": [{"ar": "وَالْعَصْرِ", "ph": "wa-l-`aṣr", "fr": "Je prends le temps à témoin"}, {"ar": "إِنَّ الْإِنسَانَ لَفِي خُسْرٍ", "ph": "inna-l-insâna lafî khousr", "fr": "Que l'homme court à sa perte"}, {"ar": "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ", "ph": "illâ l-ladhîna âmanoû wa `amilou ṣ-ṣâliḥâti wa tawâṣaw bi-l-ḥaqqi wa tawâṣaw bi-ṣ-ṣabr", "fr": "Sauf celui qui croit, qui fait le bien et encourage les autres à faire de bonnes actions et à faire preuve de patience."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah nous dit combien il est important de ne pas perdre son temps inutilement, car le temps est un bien précieux qu'on ne pourra jamais récupérer si on le perd."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Deux Compagnons étaient ensemble. Au moment de se séparer, le Prophète ﷺ leur dit qu'il était bon de réciter la sourate al-`Aṣr avant de se quitter."}, {"k": "lesson", "t": "L'importance du temps", "x": "Le temps est la chose la plus précieuse que possède l'être humain, car quand il meurt, il n'a plus la possibilité de faire de bonnes actions, ni de demander pardon à Allah pour ses péchés, ni de faire des prières qui le rapprocheront du Paradis."}, {"k": "lesson", "t": "L'importance du temps", "x": "Malheureusement, certains passent leur temps à regarder la télévision, à jouer à des jeux vidéo, ou à faire des bêtises. Penses-tu que ce soit une bonne chose de rester des heures devant des dessins animés ou des films ? Non, car tu ne fais que perdre ton temps."}, {"k": "lesson", "t": "L'importance du temps", "x": "Tu aurais pu, à la place, faire quelque chose d'utile : lire ou méditer le Coran, rendre service à un ami, aider tes parents, observer la nature, faire du sport pour entretenir ton corps, lire un livre pour avoir plus de savoir, et tellement d'autres choses."}, {"k": "lesson", "t": "L'importance du temps", "x": "Ne sois pas comme ces gens qui pensent qu'ils ont tout leur temps devant eux, et qui passent leur vie à ne rien faire d'utile ni pour eux ni pour les autres."}, {"k": "lesson", "t": "L'importance du temps", "x": "Allah n'a donné à chacun d'entre nous qu'un certain nombre d'années à vivre, et les plus profitables sont celles que tu vis maintenant, pendant que tu es jeune et en bonne santé."}, {"k": "lesson", "t": "L'importance du temps", "x": "Allah nous dit dans cette sourate qu'il faut profiter de notre temps pour pousser les gens à la vérité et à la patience, car c'est ainsi qu'ils se rapprocheront d'Allah."}, {"k": "lesson", "t": "L'importance du temps", "x": "Il est donc important de donner de bons conseils aux gens pour qu'ils soient de bons musulmans, et d'être à leur écoute s'ils ont des problèmes. Tu pourras les encourager à patienter et à faire confiance à Allah."}, {"k": "word", "t": "Le mot à retenir", "ar": "إِنسَانٌ", "tr": "insân", "x": "Homme"}, {"k": "box", "t": "Qu'est-ce que le TEMPS (al-`aṣr) ?", "x": "En arabe, al-`aṣr veut dire « ce qu'on essore » et qui s'écoule vite. Al-`aṣr est le temps qui court et qu'on a du mal à retenir."}, {"k": "box", "t": "Qu'est-ce que le TEMPS (al-`aṣr) ?", "x": "C'est le temps de la vie sur terre. Il ne dure pas longtemps, contrairement à la vie que l'on aura dans l'au-delà."}, {"k": "box", "t": "Qu'est-ce que le TEMPS (al-`aṣr) ?", "x": "À nous d'œuvrer pour que notre temps dans l'éternité soit au paradis."}, {"k": "tip", "t": "Mon conseil", "x": "Profite de ton temps, c'est ce que tu as de plus précieux."}, {"k": "tip", "t": "Mon conseil", "x": "Sois de bon conseil pour tes amis et ta famille et encourage-les à faire le bien et à se rapprocher d'Allah."}, {"k": "tip", "t": "Mon conseil", "x": "Si une personne te donne des conseils, tu dois les accepter et essayer de t'améliorer. Le but n'est pas d'avoir raison, le but est qu'Allah soit content de toi."}, {"k": "morale", "t": "La morale à garder", "x": "Mon temps est précieux : je ne le perds pas devant les écrans. Je le consacre à ce qui est utile, je donne de bons conseils et j'encourage les autres à la vérité et à la patience."}], "quiz": [{"q": "Que veut dire « al-`aṣr » ?", "a": ["Le temps", "La terre", "La nuit", "Le soleil"], "e": "al-`aṣr, c'est le temps qui court et qu'on a du mal à retenir."}, {"q": "Que veut dire « insân » ?", "a": ["Homme", "Ange", "Animal", "Montagne"], "e": "insân signifie « homme »."}, {"q": "Que dit le Prophète ﷺ à deux Compagnons qui se séparent ?", "a": ["Il est bon de réciter al-`Aṣr avant de se quitter", "Il faut courir", "Il faut se disputer", "Il faut dormir"], "e": "Le Prophète ﷺ leur dit qu'il était bon de réciter cette sourate avant de se quitter."}, {"q": "Pourquoi le temps est-il si précieux ?", "a": ["On ne peut jamais le récupérer si on le perd", "Parce qu'il est gratuit", "Parce qu'il s'arrête quand on dort", "Parce qu'il est toujours long"], "e": "Après la mort, on ne peut plus faire de bonnes actions ni demander pardon."}, {"q": "Qu'est-ce qui fait perdre du temps, selon le livre ?", "a": ["Rester des heures devant la télé et les jeux vidéo", "Lire le Coran", "Aider ses parents", "Faire du sport"], "e": "Tu aurais pu faire quelque chose d'utile à la place."}, {"q": "Cite une chose utile à faire de son temps :", "a": ["Rendre service à un ami", "Faire des bêtises", "Rester sans rien faire", "Se moquer des autres"], "e": "Lire le Coran, aider ses parents, observer la nature, faire du sport..."}, {"q": "Quelles sont les années les plus profitables ?", "a": ["Celles que tu vis maintenant, jeune et en bonne santé", "Celles de la vieillesse", "Celles qu'on ne vit pas encore", "Aucune"], "e": "Profite de ta jeunesse et de ta santé avant qu'il ne soit trop tard."}, {"q": "Qui échappe à la perte, selon la sourate ?", "a": ["Celui qui croit, fait le bien, et encourage la vérité et la patience", "Celui qui est riche", "Celui qui est fort", "Celui qui dort beaucoup"], "e": "Sauf celui qui croit, qui fait le bien et encourage les autres à faire de bonnes actions et à la patience."}, {"q": "Que faire quand une personne te donne un bon conseil ?", "a": ["L'accepter et essayer de s'améliorer", "Se fâcher", "L'ignorer", "Vouloir avoir raison"], "e": "Le but n'est pas d'avoir raison, le but est qu'Allah soit content de toi."}, {"q": "Comment aider les autres à se rapprocher d'Allah ?", "a": ["Leur donner de bons conseils et les écouter", "Se moquer d'eux", "Les éviter", "Les obliger"], "e": "Encourage-les à patienter et à faire confiance à Allah."}]}, {"id": 106, "ar": "قريش", "fr": "Qouraych", "mean": "Les Qouraych", "emo": "🐪", "v": [{"ar": "لِإِيلَافِ قُرَيْشٍ", "ph": "li-îlâfi qouraych", "fr": "Les Qouraych ont un pacte."}, {"ar": "إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ", "ph": "îlâfihim riḥlata ch-chitâ'i wa ṣ-ṣayf", "fr": "Qui leur permet de conduire leurs caravanes hiver comme été."}, {"ar": "فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ", "ph": "fa-l-ya`boudoû rabba hâdha-l-bayt", "fr": "Ils devraient donc adorer le Seigneur de cette Maison"}, {"ar": "الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ", "ph": "alladhî aṭ`amahoum m-min joû`in wa âmanahoum m-min khawf", "fr": "Qui les nourrit contre la faim et les rassure contre la peur."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah rappelle aux Qouraych toutes les faveurs dont Il les a comblés. Il leur demande donc de Le remercier et de Le vénérer pour cela."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Allah a accordé énormément de bienfaits aux Qouraych : le plus important est le fait qu'ils ont reçu la dernière prophétie, celle du Prophète Moḥammad ﷺ."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Mais il y en avait d'autres : ils étaient les gardiens de la Ka`ba et ce sont eux qui s'occupaient d'abreuver les pèlerins, ce qui était une noble tâche. Allah les a sauvés d'Abraha et de l'éléphant."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Et enfin, Il a révélé une sourate qui porte leur nom. Ce sont de grandes faveurs, n'est-ce pas ?"}, {"k": "lesson", "t": "La bénédiction d'Allah sur Sa maison", "x": "Quand le prophète Ibrahim a fini de construire la Ka`ba, il a fait une prière à Allah, en Lui demandant de protéger cet endroit ainsi que ses habitants, et de les combler de Ses faveurs. Et Allah a exaucé Son bien-aimé prophète."}, {"k": "lesson", "t": "La bénédiction d'Allah sur Sa maison", "x": "La Mecque est devenue une cité prospère où les caravanes venaient de toute l'Arabie. C'était surtout le lieu de pèlerinage pour tous les Arabes de la région."}, {"k": "lesson", "t": "La bénédiction d'Allah sur Sa maison", "x": "Il y avait donc richesses, abondance et prospérité."}, {"k": "lesson", "t": "La bénédiction d'Allah sur Sa maison", "x": "Deux fois par an, ils voyageaient : une caravane allait vers le Yémen en hiver, et une autre vers le Châm (la Syrie actuelle) en été."}, {"k": "lesson", "t": "La bénédiction d'Allah sur Sa maison", "x": "Ils emmenaient des marchandises et revenaient avec des produits qu'ils n'avaient pas, comme le sel par exemple."}, {"k": "lesson", "t": "La bénédiction d'Allah sur Sa maison", "x": "Dans cette sourate, Allah rappelle l'honneur qu'Il a fait aux Qouraych en leur donnant la protection de la Ka`ba, car sans elle La Mecque ne serait qu'une contrée désertique et isolée."}, {"k": "box", "t": "Qui sont les QOURAYCH ?", "x": "Les Qouraych sont la tribu du Prophète ﷺ. Ils vivaient à La Mecque et étaient la plus grande tribu d'Arabie."}, {"k": "box", "t": "Qu'est-ce que la MAISON ?", "x": "La Maison dont parle cette sourate est la Ka`ba, la maison d'Allah construite par le prophète Ibrahim et son fils Ismaïl. C'est vers elle que nous nous dirigeons lorsque nous faisons la prière."}, {"k": "box", "t": "Qu'est-ce que la MAISON ?", "x": "C'est un lieu sacré dans lequel les musulmans doivent se rendre une fois dans leur vie pour accomplir le pèlerinage (ḥajj)."}, {"k": "tip", "t": "Mon conseil", "x": "Tout ce que tu possèdes, tu le dois à Allah. Sans Lui, tu n'aurais rien du tout, malgré tes efforts."}, {"k": "tip", "t": "Mon conseil", "x": "N'oublie pas de Le remercier en disant al-ḥamdoulillâh et ach-choukrou lillâh."}, {"k": "tip", "t": "Mon conseil", "x": "Si Allah t'a donné beaucoup, reste modeste et humble. Cela veut dire que tu ne dois pas te sentir supérieur aux autres."}, {"k": "tip", "t": "Mon conseil", "x": "Si tu désires quelque chose, demande-le à Allah. C'est Lui qui te le donnera si c'est un bien pour toi."}, {"k": "morale", "t": "La morale à garder", "x": "Tout ce que j'ai, je le dois à Allah : je Le remercie (al-ḥamdoulillâh, ach-choukrou lillâh), je reste humble, et je Lui demande ce que je désire."}], "quiz": [{"q": "Qui sont les Qouraych ?", "a": ["La tribu du Prophète ﷺ", "Des voyageurs du Yémen", "Une armée étrangère", "Des anges"], "e": "Ils vivaient à La Mecque et étaient la plus grande tribu d'Arabie."}, {"q": "De quelle « Maison » parle la sourate ?", "a": ["La Ka`ba", "La maison du Prophète", "Une mosquée de Médine", "Un palais"], "e": "C'est la maison d'Allah, construite par Ibrahim et son fils Ismaïl."}, {"q": "Qui a construit la Ka`ba ?", "a": ["Ibrahim et son fils Ismaïl", "Mousa", "`Abd al-Mouṭṭalib", "Abraha"], "e": "Le prophète Ibrahim et son fils Ismaïl l'ont construite."}, {"q": "Où allait la caravane d'hiver ?", "a": ["Au Yémen", "En Syrie", "À Médine", "En Égypte"], "e": "L'hiver, une caravane allait vers le Yémen."}, {"q": "Où allait la caravane d'été ?", "a": ["Au Châm (la Syrie actuelle)", "Au Yémen", "À Jérusalem", "En Inde"], "e": "L'été, l'autre caravane allait vers le Châm."}, {"q": "Quelle noble tâche accomplissaient les Qouraych ?", "a": ["Abreuver les pèlerins", "Garder des troupeaux", "Construire des bateaux", "Fabriquer des statues"], "e": "Ils étaient gardiens de la Ka`ba et abreuvaient les pèlerins."}, {"q": "Quelle est la plus grande faveur faite aux Qouraych ?", "a": ["Avoir reçu la dernière prophétie, celle de Moḥammad ﷺ", "Avoir un grand marché", "Avoir des chameaux", "Avoir du sel"], "e": "Le plus important : ils ont reçu la dernière prophétie."}, {"q": "Que demande Allah aux Qouraych dans cette sourate ?", "a": ["Adorer le Seigneur de cette Maison", "Partir en voyage", "Construire un temple", "Combattre"], "e": "Ils devraient adorer le Seigneur de cette Maison, qui les nourrit et les rassure."}, {"q": "Que fait Allah pour eux d'après le dernier verset ?", "a": ["Il les nourrit contre la faim et les rassure contre la peur", "Il les punit", "Il les chasse", "Il les rend invisibles"], "e": "Il les nourrit contre la faim et les rassure contre la peur."}, {"q": "Que dire pour remercier Allah ?", "a": ["Al-ḥamdoulillâh et ach-choukrou lillâh", "Astaghfiroullâh", "Lâ ilâha", "Aucune parole"], "e": "Remercie-Le pour tout ce que tu possèdes."}]}, {"id": 105, "ar": "الفيل", "fr": "Al-Fîl", "mean": "L'éléphant", "emo": "🐘", "v": [{"ar": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ", "ph": "alam tara kayfa fa`ala rabbouka bi-aṣḥâbi-l-fîl", "fr": "N'as-tu pas vu comment ton Seigneur a arrêté les gens de l'éléphant ?"}, {"ar": "أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ", "ph": "alam yaj`al kaydahoum fî taḍlîl", "fr": "N'a-t-Il pas déjoué leur mauvais plan"}, {"ar": "وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ", "ph": "wa arsala `alayhim ṭayran abâbîl", "fr": "En lançant contre eux des nuées d'oiseaux"}, {"ar": "تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ", "ph": "tarmîhim bi-ḥijâratin m-min sijjîl", "fr": "Qui les bombardèrent de pierres d'argile ?"}, {"ar": "فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ", "ph": "fa-ja`alahoum ka`aṣfin m-ma'koûl", "fr": "À la fin, ils étaient tellement détruits qu'ils ressemblaient à des grains picorés."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Cette sourate parle de l'attaque de l'armée de l'éléphant envers la Ka`ba. Mais Allah a protégé Sa maison et Il a détruit cette armée."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Juste avant la naissance du Prophète ﷺ, vivait Abraha, le gouverneur du Yémen. Il était très jaloux des Mecquois et voulait lui aussi édifier un temple immense pour adorer Allah."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Mais les gens étaient attachés à la Ka`ba et le temple d'Abraha resta vide. Des Arabes se moquèrent de son temple, ce qui le mit dans une colère noire."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Il se jura alors de monter une immense armée, avec même un éléphant, afin de détruire la Ka`ba !"}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Quand ils arrivèrent, ils pillèrent tout sur leur passage, et ils se permirent de voler un troupeau de chameaux appartenant à `Abd al-Mouṭṭalib, le grand-père du Prophète ﷺ."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Ce dernier était le chef des Qouraych, et il savait qu'ils n'étaient pas assez nombreux pour vaincre l'armée d'Abraha."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Alors il réunit tout le monde autour de la Ka`ba, il pria Allah de protéger Sa maison puis il ordonna aux gens de sa tribu d'aller se cacher dans les montagnes."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Il alla aussi rendre visite à Abraha et lui dit : « Je viens te voir pour que tu me rendes mes chameaux. » Abraha était impressionné, car `Abd al-Mouṭṭalib était digne et avait fière allure."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Mais cet homme qu'il admirait lui demandait uniquement ses chameaux : « Tu ne viens que pour tes chameaux et tu ne t'occupes même pas de la Ka`ba ? »"}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "`Abd al-Mouṭṭalib répondit avec fierté : « Je suis le maître de mes chameaux et je m'occupe d'eux. La Ka`ba, quant à elle, son Maître la protégera. »"}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Puis il récupéra ses chameaux et rejoignit les gens de sa tribu pour prier Allah de protéger la Ka`ba."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Quand Abraha leva son armée pour attaquer la Ka`ba, l'éléphant refusa de faire un seul pas. Il savait qu'il était une créature d'Allah et il ne voulait pas détruire la Ka`ba, qui est une maison sacrée."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Les soldats insistèrent, mais l'éléphant restait là, sans bouger."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Soudain, des milliers d'oiseaux fondirent sur l'armée d'Abraha, chacun avait dans les serres des pierres d'argile brûlantes qu'ils jetaient sur l'armée. Chaque fois qu'une pierre touchait un soldat, celui-ci mourait sur-le-champ."}, {"k": "lesson", "t": "Les gens de l'éléphant", "x": "Ainsi Allah protégea-t-Il Sa maison et Abraha fut vaincu définitivement, car il avait oublié que personne n'est plus puissant que le Maître de la Ka`ba."}, {"k": "box", "t": "Qu'est-ce que l'année de l'ÉLÉPHANT ?", "x": "C'est en 570 que `Abd al-Mouṭṭalib a vu comment Allah a sauvé la Ka`ba du méchant Abraha. Mais Allah lui a donné un autre bienfait cette année-là, car peu de temps après est né son petit-fils Moḥammad, notre bien-aimé Prophète ﷺ."}, {"k": "tip", "t": "Mon conseil", "x": "L'arrogance et la vanité ne t'amèneront à rien, alors fais attention de ne pas te laisser déborder par ces sentiments négatifs."}, {"k": "tip", "t": "Mon conseil", "x": "Il ne te sert à rien d'être jaloux, car c'est Allah qui donne. Il faut au contraire Le remercier pour ce que tu possèdes et Lui demander tout en restant patient."}, {"k": "tip", "t": "Mon conseil", "x": "Si tu restes proche d'Allah par la prière et la confiance en Lui, Il t'aidera sans nul doute."}, {"k": "morale", "t": "La morale à garder", "x": "Allah protège ceux qui Lui font confiance, et rien n'arrête Sa volonté. Je ne suis ni arrogant ni jaloux : je remercie Allah, je prie et je Lui fais confiance."}], "quiz": [{"q": "Que veut dire « al-Fîl » ?", "a": ["L'éléphant", "Le lion", "Le chameau", "L'oiseau"], "e": "al-Fîl signifie « l'éléphant »."}, {"q": "Qui était Abraha ?", "a": ["Le gouverneur du Yémen", "Le chef des Qouraych", "Un prophète", "Un marchand de Médine"], "e": "Abraha était le gouverneur du Yémen."}, {"q": "Pourquoi Abraha voulait-il détruire la Ka`ba ?", "a": ["Son temple resta vide et il était jaloux et en colère", "Pour construire une école", "Pour protéger les pèlerins", "Parce qu'on le lui avait demandé"], "e": "Les gens étaient attachés à la Ka`ba et se moquèrent de son temple vide."}, {"q": "Qui est `Abd al-Mouṭṭalib ?", "a": ["Le grand-père du Prophète ﷺ et chef des Qouraych", "Un soldat d'Abraha", "Un ange", "Le père d'Abraha"], "e": "Il était le chef des Qouraych et le grand-père du Prophète."}, {"q": "Que demanda `Abd al-Mouṭṭalib à Abraha ?", "a": ["Qu'il lui rende ses chameaux", "De ne pas attaquer la Ka`ba", "Un grand cadeau", "De partir en voyage"], "e": "Il dit : « Je suis le maître de mes chameaux ; la Ka`ba, son Maître la protégera. »"}, {"q": "Que fit l'éléphant quand l'armée avança vers la Ka`ba ?", "a": ["Il refusa de faire un seul pas", "Il courut", "Il attaqua les Mecquois", "Il s'endormit"], "e": "Il savait que c'était une créature d'Allah et que la Ka`ba est une maison sacrée."}, {"q": "Qu'envoya Allah contre l'armée ?", "a": ["Des nuées d'oiseaux avec des pierres d'argile", "Une grande tempête de sable", "Un tremblement de terre", "Un grand feu"], "e": "Les oiseaux lançaient des pierres d'argile brûlantes."}, {"q": "En quelle année cela s'est-il passé ?", "a": ["570", "610", "622", "1000"], "e": "C'est l'année de l'éléphant, en 570."}, {"q": "Quel autre bienfait est arrivé cette année-là ?", "a": ["La naissance de Moḥammad ﷺ", "Le début du ramadan", "La construction de la Ka`ba", "La fin des caravanes"], "e": "Peu après est né le petit-fils de `Abd al-Mouṭṭalib, notre bien-aimé Prophète ﷺ."}, {"q": "Que doit-on faire pour qu'Allah nous aide ?", "a": ["Rester proche de Lui par la prière et la confiance", "Être arrogant", "Être jaloux", "Se moquer des autres"], "e": "Si tu restes proche d'Allah par la prière et la confiance en Lui, Il t'aidera."}]}, {"id": 111, "ar": "المسد", "fr": "Al-Masad", "mean": "La corde", "emo": "🧶", "v": [{"ar": "تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ", "ph": "tabbat yadâ abî lahabin wa tabb", "fr": "Que les deux mains d'Abou Lahab périssent et qu'il périsse lui-même !"}, {"ar": "مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ", "ph": "mâ aghnâ `anhou mâlouhou wa mâ kasab", "fr": "Ni son argent ni tout ce qu'il a acquis ne lui ont servi à rien."}, {"ar": "سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ", "ph": "sayaṣlâ nâran dhâta lahab", "fr": "Il brûlera bientôt dans un feu plein de flammes,"}, {"ar": "وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ", "ph": "wa-mra'atouhou ḥammâlata-l-ḥaṭab", "fr": "lui ainsi que sa femme, la porteuse de bois"}, {"ar": "فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ", "ph": "fî jîdihâ ḥabloun min-masad", "fr": "qui sera traînée par une corde au cou."}], "cards": [{"k": "theme", "t": "Le thème", "x": "Dans cette sourate, Allah raconte comment Abou Lahab et sa femme combattaient le Prophète Moḥammad ﷺ. Allah n'a pas laissé ces deux êtres méchants impunis, car Il leur a raconté de leur vivant comment ils seraient punis en enfer."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Quand le Prophète Moḥammad reçut la révélation, il alla sur la colline de Ṣafa, juste à côté de la Ka`ba, et se mit à appeler les gens qui s'attroupèrent autour de lui."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Quand tout le monde fut rassemblé, il dit : « Si je vous disais qu'une armée allait dévaler de cette colline pour vous attaquer, me croiriez-vous ? » Les gens répondirent en chœur : « Bien sûr ! Tu dis toujours la vérité ! »"}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Le Prophète dit alors : « Ô mon peuple, je vous mets en garde contre le châtiment d'Allah. Sauvez-vous des flammes de l'enfer ! »"}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Abou Lahab cria alors : « Malheur à toi ! Ne nous as-tu réunis que pour cela ? » Il empêcha le Prophète de parler et força la foule à s'éparpiller, afin que personne n'écoute les paroles du Prophète ﷺ."}, {"k": "lesson", "t": "L'histoire d'Abou Lahab", "x": "Abou Lahab et sa femme, Oum Jamil, détestaient le Prophète ﷺ. Ils faisaient tout pour faire obstacle à leur neveu et empêcher les gens de Qouraych de se convertir à l'islam."}, {"k": "lesson", "t": "L'histoire d'Abou Lahab", "x": "Leur maison était juste à côté de celle du Prophète et, chaque jour, Oum Jamil venait poser des épines et des ordures devant la maison de notre pauvre Prophète, afin qu'il se blesse et se salisse."}, {"k": "lesson", "t": "L'histoire d'Abou Lahab", "x": "Quand le Prophète sortait vers la Ka`ba, elle le suivait pour l'insulter et dire du mal de lui. Et quand il priait, elle mettait sur lui des intestins d'animaux, en se moquant de lui avec Abou Lahab et sa troupe."}, {"k": "lesson", "t": "L'histoire d'Abou Lahab", "x": "Évidemment, Allah protégeait Son Prophète et lui demandait de faire preuve de patience."}, {"k": "lesson", "t": "L'histoire d'Abou Lahab", "x": "Il était certain qu'Allah n'allait pas laisser toutes ces mauvaises actions impunies, mais ce qui est étonnant, c'est qu'Allah a prévenu Abou Lahab et Oum Jamil de leur vivant de ce qui allait leur arriver dans l'au-delà : leur punition serait immense !"}, {"k": "lesson", "t": "L'histoire d'Abou Lahab", "x": "Et Abou Lahab, malgré sa richesse et son rang, ne pourrait rien devant la terrible punition de son Seigneur."}, {"k": "box", "t": "Qui est ABOU LAHAB ?", "x": "Abou Lahab est l'oncle du Prophète Moḥammad ﷺ. Il vivait à La Mecque."}, {"k": "box", "t": "Qui est ABOU LAHAB ?", "x": "C'était un homme riche et puissant, mais très méchant car il combattait son neveu et l'islam."}, {"k": "tip", "t": "Mon conseil", "x": "Allah n'aime pas qu'on fasse du mal aux autres. Alors efforce-toi d'être gentil et attentionné."}, {"k": "tip", "t": "Mon conseil", "x": "C'est tellement plus agréable d'avoir des amis !"}, {"k": "tip", "t": "Mon conseil", "x": "Allah aime quand on invite les gens à faire le bien. N'hésite pas à encourager tes frères, tes sœurs et tes amis à faire le bien. Mais, surtout, montre l'exemple !"}, {"k": "tip", "t": "Mon conseil", "x": "Si tes amis te parlent et te donnent de bons conseils, il faut les écouter. Ne sois pas comme Oum Jamil qui préférait insulter et se moquer du Prophète ﷺ."}, {"k": "morale", "t": "La morale à garder", "x": "Je suis gentil et attentionné avec les autres, je les encourage à faire le bien en montrant l'exemple, et j'écoute les bons conseils. L'argent et le rang ne protègent pas de la punition d'Allah."}], "quiz": [{"q": "Que veut dire « al-Masad » ?", "a": ["La corde", "Le feu", "Le bois", "La colline"], "e": "al-Masad signifie « la corde »."}, {"q": "Qui est Abou Lahab ?", "a": ["L'oncle du Prophète ﷺ, riche, puissant et méchant", "Un ami fidèle du Prophète", "Un ange", "Un voisin pauvre"], "e": "Il combattait son neveu et l'islam."}, {"q": "Comment s'appelait la femme d'Abou Lahab ?", "a": ["Oum Jamil", "Ḥawwa", "`Â'icha", "Khadîja"], "e": "Oum Jamil détestait aussi le Prophète ﷺ."}, {"q": "Sur quelle colline le Prophète ﷺ appela-t-il les gens ?", "a": ["Ṣafa", "Le mont Sinaï", "Le mont Uḥud", "La colline d'Arafa"], "e": "La colline de Ṣafa est juste à côté de la Ka`ba."}, {"q": "Que répondirent les gens quand il leur demanda s'ils le croiraient ?", "a": ["Bien sûr ! Tu dis toujours la vérité !", "Non, tu mens", "Nous ne savons pas", "Nous sommes occupés"], "e": "Tout le monde savait que le Prophète ﷺ disait toujours la vérité."}, {"q": "Que fit Abou Lahab ?", "a": ["Il empêcha le Prophète de parler et fit disperser la foule", "Il écouta en silence", "Il aida le Prophète", "Il se convertit"], "e": "Il cria : « Malheur à toi ! » et força la foule à s'éparpiller."}, {"q": "Que faisait Oum Jamil devant la maison du Prophète ?", "a": ["Elle posait des épines et des ordures", "Elle apportait des fleurs", "Elle chantait", "Elle faisait la prière"], "e": "Elle voulait qu'il se blesse et se salisse."}, {"q": "Qu'est-ce qui est étonnant dans cette sourate ?", "a": ["Allah a prévenu Abou Lahab de sa punition de son vivant", "Allah l'a oublié", "Allah l'a récompensé", "Elle ne parle de personne"], "e": "Malgré cela, il ne s'est pas repenti."}, {"q": "L'argent d'Abou Lahab lui a-t-il servi ?", "a": ["Non, ni son argent ni ce qu'il a acquis", "Oui, il l'a sauvé", "Oui, en partie", "On ne sait pas"], "e": "Malgré sa richesse et son rang, il ne pourrait rien devant la punition de son Seigneur."}, {"q": "Que doit-on faire quand des amis nous donnent de bons conseils ?", "a": ["Les écouter", "Les insulter", "Se moquer d'eux", "S'enfuir"], "e": "Ne sois pas comme Oum Jamil qui préférait insulter et se moquer."}]}, {"id": 109, "ar": "الكافرون", "fr": "Al-Kâfirûn", "mean": "Les négateurs", "emo": "🕊️", "v": [{"ar": "قُلْ يَا أَيُّهَا الْكَافِرُونَ", "ph": "qoul yâ ayyouha-l-kâfirûn", "fr": "Dis : « Ô vous les négateurs !"}, {"ar": "لَا أَعْبُدُ مَا تَعْبُدُونَ", "ph": "lâ a`boudou mâ ta`boudoûn", "fr": "Je n'adore pas ce que vous adorez,"}, {"ar": "وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ", "ph": "wa lâ antoum `âbidoûna mâ a`boud", "fr": "comme vous n'adorez pas ce que j'adore."}, {"ar": "وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ", "ph": "wa lâ ana `âbidoun m-mâ `abattoum", "fr": "Je ne suis pas adorateur de ce que vous adorez."}, {"ar": "وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ", "ph": "wa lâ antoum `âbidoûna mâ a`boud", "fr": "Et vous n'êtes pas adorateurs de ce que j'adore."}, {"ar": "لَكُمْ دِينُكُمْ وَلِيَ دِينِ", "ph": "lakoum dînoukoum wa liya dîn", "fr": "À vous votre religion et à moi ma religion ! »"}], "cards": [{"k": "theme", "t": "Le thème", "x": "Cette sourate fait la séparation claire entre les négateurs et le Prophète Moḥammad dans la croyance. Le Prophète et les musulmans n'adoreront jamais ce que les négateurs adorent."}, {"k": "theme", "t": "Le thème", "x": "Pour ce qui est des négateurs, la lumière de leur cœur a disparu avec leurs fausses adorations. Ils n'ont donc rien à voir avec les musulmans, qui, eux, ont gardé leur lumière intacte."}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Un jour, quatre hommes menés par Walid ibn al-Moughîra vinrent voir le Prophète ﷺ et lui firent cette étrange proposition : « Moḥammad, nous sommes d'accord pour adopter ta religion. Mais voilà ce que nous allons faire : nous adorerons ton Dieu un jour, et le lendemain, nous adorerons nos dieux. »"}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Bien sûr, c'était une proposition absurde ! Pourquoi le Prophète adorerait-il des statues, alors qu'Allah lui a montré la vérité ?!"}, {"k": "story", "t": "Pourquoi cette sourate ?", "x": "Allah révéla alors la sourate al-Kâfirûn, afin de montrer clairement et définitivement la séparation nette qu'il y a entre ceux qui ont rejeté Allah et les musulmans qui ont écouté leur cœur pour suivre la vraie religion, l'islam."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Les Arabes reconnaissaient Allah et ils L'adoraient, mais ils adoraient aussi plusieurs sortes d'autres dieux : ils avaient pour dieux les djinns qu'ils craignaient par-dessus tout."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Ils adoraient aussi des gens morts depuis longtemps : c'étaient des gens pieux et sages dont la noblesse était arrivée jusqu'à eux. Ils décidèrent d'en faire des dieux et de les adorer aussi."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Ils pensaient qu'en agissant ainsi, ils se rapprochaient d'Allah. Mais, en faisant cela, ils associaient d'autres créatures à Allah."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Et penses-tu que cela soit permis ? Non, évidemment, car il n'existe pas d'autre dieu."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Le comportement le plus étrange des Arabes de l'époque était de fabriquer de leurs propres mains des statues pour les adorer et se prosterner devant elles."}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Certaines étaient faites de pierre, d'autres de bois et certaines même de nourriture, et quand ils avaient faim, ils les mangeaient !"}, {"k": "lesson", "t": "Ne pas suivre les négateurs", "x": "Ils avaient oub
